<html lang="en">
<head>
<meta charset="UTF-8">
<title>BagelBoy — Performance Dashboard (per location)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f5f4f1; --card: #ffffff; --ink: #1c1a17; --muted: #837c72;
    --accent: #7a3f22; --accent2: #b5652f; --green: #1f7a3d; --green-bg: #e7f5ea;
    --red: #b23b2e; --red-bg: #fdeceb; --border: #bdb5a8; --border-soft:#d3ccc0; --gold: #c8892a;
    --shadow: 0 1px 2px rgba(20,16,10,.04), 0 4px 16px rgba(20,16,10,.04);
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing:antialiased; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 28px 24px; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 18px; flex-wrap:wrap; gap:8px;}
  h1 { font-size: 20px; margin:0; color: var(--ink); font-weight:700; letter-spacing:-.01em; }
  h2 { font-size:14px; margin:0; font-weight:600; color:var(--ink); }
  .sub { color: var(--muted); font-size: 12.5px; }
  .panel { background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
  .chip-row { display:flex; gap:4px; flex-wrap:wrap; }
  .chip { padding:7px 15px; border-radius:999px; border:1px solid transparent; background:transparent; cursor:pointer; font-size:13.5px; color: var(--muted); user-select:none; font-weight:500; transition:background .12s,color .12s; }
  .chip:hover { background: var(--border-soft); color:var(--ink); }
  .chip.active { background: var(--ink); color:#fff; border-color: var(--ink); }
  .chip.active:hover { background: var(--ink); color:#fff; }
  .chip.tab { font-weight:600; }
  .chip-row-wrap { background:#fff; border:1px solid var(--border); border-radius:12px; padding:5px; display:inline-flex; box-shadow:var(--shadow); }
  .period-chip { padding:5px 11px; border-radius:7px; border:1px solid transparent; background:transparent; cursor:pointer; font-size:12px; color: var(--muted); user-select:none; font-weight:500; }
  .period-chip:hover { background:var(--border-soft); color:var(--ink); }
  .period-chip.active { background: var(--ink); color:#fff; }
  .section-title { font-size:15px; font-weight:700; color:var(--ink); margin-bottom:12px; letter-spacing:-.01em; }
  .kpi-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(190px,1fr)); gap:12px; margin-bottom: 14px; }
  .kpi { border:1px solid var(--border-soft); border-radius:12px; padding:13px 15px; background:#fbfaf8; }
  .kpi .lbl { font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; }
  .kpi .val { font-size:23px; font-weight:700; margin:5px 0 2px; letter-spacing:-.01em; }
  .kpi .ref { font-size:11px; color:var(--muted); }
  .kpi .ref.bad { color: var(--red); }
  .kpi .ref.good { color: var(--green); }
  .chart-wrap { position:relative; height:260px; margin-bottom:8px; }
  .chart-wrap.small { height:200px; }
  .two-col { display:grid; grid-template-columns: 1fr 1fr; gap:18px; align-items:start; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--border-soft); }
  th { color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; font-weight:700; }
  .footnote { font-size:11px; color:var(--muted); margin-top:8px; line-height:1.55; }
  .review-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); gap:12px; }
  .review-card, .competitor-card { border:1px solid var(--border-soft); border-radius:12px; padding:14px; background:#fbfaf8; }
  .review-card h4, .competitor-card h4 { margin:0 0 4px; font-size:13.5px; color:var(--ink); font-weight:700; }
  .review-stars { color:var(--gold); font-size:15px; letter-spacing:1px; }
  .review-count { font-size:12px; color:var(--muted); }
  .review-bars { margin:8px 0; }
  .review-bar-row { display:flex; align-items:center; gap:6px; font-size:10px; color:var(--muted); margin-bottom:2px; }
  .review-bar-track { flex:1; height:6px; background:#eee; border-radius:3px; overflow:hidden; }
  .review-bar-fill { height:100%; background:var(--gold); }
  .review-keywords { display:flex; flex-wrap:wrap; gap:4px; margin:8px 0; }
  .review-keyword { font-size:11px; background:#fff; border:1px solid var(--border); border-radius:999px; padding:2px 8px; color:var(--accent); }
  .review-analysis { font-size:12px; color:var(--ink); line-height:1.6; margin-top:8px; }
  .review-recent { font-size:11px; color:var(--muted); margin-top:2px; }
  .delta-up { color: var(--green); font-weight:bold; }
  .delta-down { color: var(--red); font-weight:bold; }
  .pillar-bar-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:13px; }
  .pillar-bar-track { flex:1; height:14px; background:#eee; border-radius:7px; overflow:hidden; }
  .pillar-bar-fill { height:100%; background: var(--accent2); }
  .empty-state { font-size:13px; color:var(--muted); font-style:italic; padding:14px; text-align:center; border:1px dashed var(--border); border-radius:8px; }
  .badge { display:inline-block; font-size:10.5px; padding:2px 8px; border-radius:999px; margin-left:6px; font-weight:600; }
  .badge.good { background:var(--green-bg); color:var(--green); }
  .badge.bad { background:var(--red-bg); color:var(--red); }

  /* ---- Overview: all-locations cards (Forksight-style) ---- */
  .loc-card-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap:14px; }
  .loc-card { border:1px solid var(--border); border-radius:14px; background:#fff; box-shadow:var(--shadow); padding:16px 17px; cursor:pointer; transition:border-color .12s, transform .12s; }
  .loc-card:hover { border-color: var(--accent2); transform: translateY(-1px); }
  .loc-card.active { border-color: var(--ink); box-shadow: 0 0 0 1.5px var(--ink), var(--shadow); }
  .loc-card-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .loc-badge { font-size:10px; font-weight:800; letter-spacing:.03em; padding:2px 7px; border-radius:6px; background:var(--border-soft); color:var(--accent); }
  .loc-card-name { font-size:13px; font-weight:700; color:var(--ink); }
  .loc-card-wk { margin-left:auto; font-size:10.5px; color:var(--muted); }
  .loc-headline-lbl { font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; }
  .loc-headline-val { font-size:26px; font-weight:800; letter-spacing:-.01em; color:var(--ink); margin:3px 0 10px; }
  .metric-row { display:flex; align-items:center; gap:8px; padding:6px 0; border-top:1px solid var(--border-soft); font-size:12.5px; }
  .metric-row:first-of-type { border-top:none; }
  .metric-icon { width:14px; text-align:center; opacity:.55; font-size:11px; }
  .metric-lbl { color:var(--ink); font-weight:500; flex:0 0 auto; }
  .metric-delta { font-size:10.5px; font-weight:700; margin-left:2px; white-space:nowrap; }
  .metric-delta.up { color: var(--green); }
  .metric-delta.down { color: var(--red); }
  .metric-spacer { flex:1; }
  .metric-val { font-weight:700; color:var(--ink); white-space:nowrap; }
  .metric-pct { font-size:11px; color:var(--muted); min-width:34px; text-align:right; }
  .metric-ratio-track { position:relative; height:4px; background:var(--border-soft); border-radius:2px; overflow:hidden; margin-top:2px; }
  .metric-ratio-fill { height:100%; border-radius:2px; }
  .metric-ratio-fill.c-red { background: var(--red); }
  .metric-ratio-fill.c-green { background: var(--green); }
  .metric-ratio-fill.c-accent { background: var(--accent2); }
  .metric-sub { font-size:10.5px; color:var(--muted); margin:1px 0 4px; }
  .freshness { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  .freshness-dot { width:6px; height:6px; border-radius:50%; background:var(--green); display:inline-block; }
  /* --- Business thermometer (round 0-100 gauge + "what's costing you points") --- */
  .thermo-wrap { display:grid; grid-template-columns: 210px 1fr; gap:26px; align-items:center; }
  @media (max-width: 820px) { .thermo-wrap { grid-template-columns: 1fr; } }
  .thermo-gauge { position:relative; width:190px; height:190px; margin:0 auto; }
  .thermo-gauge svg { transform: rotate(-90deg); display:block; }
  .thermo-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .thermo-score { font-size:44px; font-weight:800; letter-spacing:-.03em; line-height:1; }
  .thermo-outof { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:800; margin-top:4px; }
  .thermo-verdict { font-size:10.5px; font-weight:800; margin-top:7px; padding:2px 10px; border-radius:999px; text-transform:uppercase; letter-spacing:.04em; }
  .thermo-head { font-size:14px; font-weight:700; margin-bottom:3px; letter-spacing:-.01em; }
  .thermo-lead { font-size:12.5px; color:var(--muted); line-height:1.5; margin-bottom:10px; }
  .gap-row { display:flex; align-items:flex-start; gap:11px; padding:9px 0; border-bottom:1px solid var(--border-soft); }
  .gap-row:last-child { border-bottom:none; padding-bottom:0; }
  .gap-pts { font-size:12px; font-weight:800; color:var(--red); min-width:46px; text-align:right; padding-top:1px; white-space:nowrap; }
  .gap-pts.ok { color: var(--green); }
  .gap-body { flex:1; font-size:12.5px; line-height:1.5; }
  .gap-what { font-weight:600; color:var(--ink); }
  .gap-fix { color: var(--muted); }
  .card-ring { position:relative; width:36px; height:36px; flex-shrink:0; }
  .card-ring svg { transform: rotate(-90deg); display:block; }
  .card-ring span { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; letter-spacing:-.02em; }
  .fc-wrap { border: 1px solid var(--border); border-radius: 10px; margin: 0 0 14px; background: #fffdfa; }
  .fc-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; flex-wrap: wrap; }
  .fc-toggle { background: none; border: 0; font: inherit; font-weight: 700; color: #7a3f22; cursor: pointer; padding: 0; }
  .fc-sum { font-weight: 700; }
  .fc-info { color: #b5652f; cursor: help; font-size: 15px; }
  .fc-body { padding: 0 14px 14px; }
  .fc-modes { display: flex; gap: 8px; margin-bottom: 10px; }
  .fc-mode { border: 1px solid var(--border); border-radius: 99px; padding: 4px 12px; font-size: 12.5px; cursor: pointer; background: #fff; }
  .fc-mode.on { background: #7a3f22; color: #fff; border-color: #7a3f22; font-weight: 600; }
  .fc-cmp { font-size: 13px; margin: 4px 0 10px; }
  .fc-log { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border-soft); }
  .fc-loghead { font-size: 13px; margin-bottom: 6px; }
  .fc-scoreblock { margin-bottom: 10px; }
  .fc-logctl { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .fc-logctl input { padding: 4px 8px; font-size: 13px; border: 1px solid var(--border-soft); border-radius: 4px; width: 130px; }
  .fc-logctl button { padding: 5px 12px; font-size: 13px; cursor: pointer; border: 1px solid var(--border-soft); border-radius: 4px; background: var(--card); }
  .fc-logctl button[disabled] { opacity: .5; cursor: default; }
  .fc-logmsg { font-size: 12px; margin-top: 6px; }
  .fc-logmsg.ok { color: var(--green); }
  .fc-logmsg.err { color: var(--red); }

  .fp-beta { background:#E8722A; color:#fff; border-radius:99px; padding:1px 7px; font-size:10.5px; vertical-align:2px; }
  .fp-toggle { background:none;border:0;font:inherit;font-weight:700;color:#E8722A;cursor:pointer;padding:0; }
  .fp-body { padding: 0 14px 14px; }
  .fc-track { color: #7a3f22; }
  .fc-ref { color: var(--muted); font-size: 11.5px; }
  .fc-ref a { color: #b5652f; }
  .fc-why { font-size: 13px; color: var(--muted); margin-bottom: 10px; line-height: 1.5; }
  .fc-controls { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; }
  .fc-controls label { display: flex; align-items: center; gap: 8px; }
  .fc-controls input[type=range] { width: 130px; }
  .fc-table { border-collapse: collapse; margin-top: 10px; font-size: 13px; width: 100%; max-width: 420px; }
  .fc-table th, .fc-table td { padding: 4px 8px; border-bottom: 1px solid var(--border-soft); }
</style>
</head>

// ---------------------------------------------------------------------------
// Revenue forecast
//
// Four steps, all from the weekly history already in this page:
//  1. Seasonal index -- for every year with enough weeks, divide each week by
//     that year's average and average those ratios across years. A store with
//     too little history borrows the blended index of the established ones.
//  2. Base level -- the last 12 real weeks, each divided by its seasonal index
//     so a summer peak doesn't masquerade as growth, then averaged.
//  3. Growth -- year on year, comparing only weeks that exist in both years.
//  4. Per future week -- same week last year x (1 + growth) when that week
//     exists, otherwise base x seasonal index. Growth tapers towards zero over
//     the horizon, because assuming today's growth holds for a year is how
//     forecasts embarrass you.
// ---------------------------------------------------------------------------
const FC_HORIZON = 13;                 // weeks ahead
const FC_MIN_WEEKS_FOR_SEASON = 40;    // a year needs this many weeks to shape the curve
const FC_BASE_WEEKS = 12;
// Year-on-year growth measured off near-empty opening weeks comes out absurdly
// high, so the established stores carry a reviewed default instead. Editable in
// the panel; these are only the starting positions.
const FC_GROWTH_DEFAULT = { Jordaan: 18, Cuyp: 26, Weteringschans: 22, Spui: 12, Consolidated: 20 };
const FC_TAPER_DEFAULT = 55;           // % of the growth that has faded by the end of the horizon

function fcKey(y, w) { return y * 100 + w; }

function fcSeasonal(series) {
  const byYear = {};
  series.forEach(s => { if (s.revenue) (byYear[s.year] = byYear[s.year] || []).push(s); });
  const sum = {}, cnt = {}; let used = 0;
  for (const y in byYear) {
    const arr = byYear[y];
    if (arr.length < FC_MIN_WEEKS_FOR_SEASON) continue;
    used++;
    const mean = arr.reduce((a, s) => a + s.revenue, 0) / arr.length;
    arr.forEach(s => { sum[s.week] = (sum[s.week] || 0) + s.revenue / mean; cnt[s.week] = (cnt[s.week] || 0) + 1; });
  }
  if (!used) return null;
  const idx = {};
  for (let w = 1; w <= 53; w++) if (cnt[w]) idx[w] = sum[w] / cnt[w];
  // Carry the last known week forward over gaps, then re-centre on 1 so the
  // index only redistributes revenue across the year and never inflates it.
  const out = {}; let last = 1;
  for (let w = 1; w <= 53; w++) { if (idx[w] != null) { out[w] = idx[w]; last = idx[w]; } else out[w] = last; }
  const vals = Object.values(out), m = vals.reduce((a, b) => a + b, 0) / vals.length;
  for (let w = 1; w <= 53; w++) out[w] = out[w] / m;
  return out;
}

let FC_BLENDED = null;
function fcBlendedSeasonal() {
  if (FC_BLENDED) return FC_BLENDED;
  const acc = {}, c = {};
  ['Jordaan', 'Cuyp', 'Weteringschans'].forEach(n => {
    const ser = fcActuals(n); if (!ser.length) return;
    const s = fcSeasonal(ser); if (!s) return;
    for (let w = 1; w <= 53; w++) { acc[w] = (acc[w] || 0) + s[w]; c[w] = (c[w] || 0) + 1; }
  });
  const out = {};
  for (let w = 1; w <= 53; w++) out[w] = c[w] ? acc[w] / c[w] : 1;
  FC_BLENDED = out; return out;
}

function fcStoreSeasonal(name) { return fcSeasonal(fcActuals(name)) || fcBlendedSeasonal(); }

function fcBaseLevel(series, seas) {
  const act = series.filter(s => s.revenue).slice(-FC_BASE_WEEKS);
  if (!act.length) return 0;
  let sum = 0;
  act.forEach(s => { sum += s.revenue / (seas[s.week] || 1); });
  return sum / act.length;
}

function fcAutoGrowth(series) {
  const m = {}; series.forEach(s => { if (s.revenue) m[fcKey(s.year, s.week)] = s.revenue; });
  const yrs = [...new Set(series.filter(s => s.revenue).map(s => s.year))].sort();
  if (yrs.length < 2) return null;
  const y2 = yrs[yrs.length - 1], y1 = y2 - 1;
  let a = 0, b = 0;
  for (let w = 1; w <= 53; w++) { if (m[fcKey(y1, w)] && m[fcKey(y2, w)]) { a += m[fcKey(y1, w)]; b += m[fcKey(y2, w)]; } }
  return a ? Math.round((b / a - 1) * 100) : null;
}

const FC_GROUP = '__group__';
function fcGroupSeries() {
  const acc = {};
  ['Jordaan', 'Cuyp', 'Weteringschans', 'Spui'].forEach(n => {
    ((DATA.weekly || {})[n] || []).forEach(s => {
      if (!s.revenue) return;
      const k = fcKey(s.year, s.week);
      (acc[k] = acc[k] || { year: s.year, week: s.week, revenue: 0 }).revenue += s.revenue;
    });
  });
  return Object.keys(acc).map(Number).sort().map(k => acc[k]);
}

// Weeks that actually carry revenue. A week sitting in the sheet with no
// revenue yet is not history -- forecasting from it would drag the base level
// down every Monday morning before the numbers are filled in.
// FC_CUT lets the model be run "as of" an earlier week without touching the
// data: everything after that week is hidden. That is what makes an honest
// backtest possible -- the forecast never gets to peek at the answer.
let FC_CUT = null;
function fcActuals(name) {
  const a = (name === '__group__' ? fcGroupSeries() : ((DATA.weekly || {})[name] || []).filter(s => s.revenue));
  return FC_CUT ? a.filter(s => fcKey(s.year, s.week) <= FC_CUT) : a;
}

function fcForecast(name, growthPct, taperPct) {
  const series = fcActuals(name);
  if (series.length < 4) return [];
  const seas = fcStoreSeasonal(name);
  const base = fcBaseLevel(series, seas);
  const m = {}; series.forEach(s => { m[fcKey(s.year, s.week)] = s.revenue; });
  const last = series[series.length - 1];
  const g0 = (growthPct != null ? growthPct : fcDefaultGrowth(name)) / 100;
  const taper = (taperPct != null ? taperPct : FC_TAPER_DEFAULT) / 100;
  let y = last.year, w = last.week;
  const out = [];
  for (let i = 0; i < FC_HORIZON; i++) {
    w++; if (w > 52) { w = 1; y++; }
    const g = g0 * (1 - taper * (i / Math.max(1, FC_HORIZON - 1)));
    const ly = m[fcKey(y - 1, w)];
    // With a comparable week last year, growth is a year-on-year step. Without
    // one, the base level already IS today's level, so the same annual rate is
    // spread forward week by week instead -- otherwise the growth setting would
    // silently do nothing for a location that opened mid-series.
    const fwd = Math.pow(1 + g, (i + 1) / 52);
    const val = (ly ? ly * (1 + g) : base * (seas[w] || 1) * fwd);
    out.push({ year: y, week: w, value: Math.max(0, val), basis: ly ? 'last year' : 'seasonal' });
  }
  return out;
}

function fcExplain(name, growthPct, taperPct) {
  const series = fcActuals(name);
  const seas = fcStoreSeasonal(name);
  const auto = fcAutoGrowth(series);
  const g = growthPct != null ? growthPct : (FC_GROWTH_DEFAULT[name] ?? auto ?? 0);
  const t = taperPct != null ? taperPct : FC_TAPER_DEFAULT;
  const ownSeason = fcSeasonal(series) != null;
  const fc = fcForecast(name, growthPct, taperPct);
  const fromLY = fc.filter(f => f.basis === 'last year').length;
  return `How this forecast is built
1. Seasonal shape — each week divided by its own year's average, averaged over the years with a full history${ownSeason ? '' : '. This location has too little history of its own, so it borrows the blended shape of Jordaan, Cuyp and Weteringschans'}.
2. Base level — the last ${Math.min(FC_BASE_WEEKS, series.length)} weeks with revenue, each corrected for season, averaged: EUR ${Math.round(fcBaseLevel(series, seas)).toLocaleString('nl-NL')} per week.
3. Growth — ${growthPct != null ? 'set by you' : 'starting value'} ${g > 0 ? '+' : ''}${g}% versus last year${auto != null ? ` (raw year-on-year in the data: ${auto > 0 ? '+' : ''}${auto}%)` : ''}.
4. Per week — ${fromLY} of the ${FC_HORIZON} weeks use the same week last year x (1 + growth); the rest fall back to base x seasonal index. Growth fades to ${Math.round(g * (1 - t / 100))}% by week ${FC_HORIZON}, because assuming today's growth holds all year is how forecasts go wrong.

Not in the model: weather, holidays, price changes, a new location opening. Treat it as the trend line, not a promise.`;
}
// Group forecast = the four locations added up, NOT a forecast of the
// Consolidated row. That row is real history, but forecasting from it compares
// this autumn against an autumn when Spui did not exist yet, so every week
// lands ~15% low. Forecasting each location on its own and summing keeps a
// store that opened mid-series in the total where it belongs.
// `adj` shifts every location by the same number of percentage points, so the
// reviewed per-location growth rates stay intact while a scenario is played.
function fcForecastGroup(adj, taperPct) {
  const locs = ['Jordaan', 'Cuyp', 'Weteringschans', 'Spui'].filter(n => fcActuals(n).length >= 4);
  const per = locs.map(n => {
    const tn = fcTune(n);                                   // its own tuned settings
    const base = fcDefaultGrowth(n, tn.win);
    const tp = taperPct != null ? taperPct : tn.taper;      // a manual taper overrides all of them
    return { name: n, used: base + (adj || 0), win: tn.win, taper: tp,
             fc: fcForecast(n, base + (adj || 0), tp) };
  });
  const len = per.length ? Math.min(...per.map(p => p.fc.length)) : 0;
  const out = [];
  for (let i = 0; i < len; i++) {
    const first = per[0].fc[i];
    out.push({ year: first.year, week: first.week,
               value: per.reduce((a, p) => a + p.fc[i].value, 0),
               basis: per.every(p => p.fc[i].basis === 'last year') ? 'last year' : 'mixed' });
  }
  return { weeks: out, per: per, locs: locs };
}

// Same shape as fcForecastGroup, but every location on one growth number --
// the "my own scenario" mode, where the measured rates are set aside on purpose.
function fcForecastGroupAbsolute(growthPct, taperPct) {
  const locs = ['Jordaan', 'Cuyp', 'Weteringschans', 'Spui'].filter(n => fcActuals(n).length >= 4);
  const per = locs.map(n => ({ name: n, used: growthPct, fc: fcForecast(n, growthPct, taperPct) }));
  const len = per.length ? Math.min(...per.map(p => p.fc.length)) : 0;
  const out = [];
  for (let i = 0; i < len; i++) {
    const first = per[0].fc[i];
    out.push({ year: first.year, week: first.week,
               value: per.reduce((a, p) => a + p.fc[i].value, 0),
               basis: per.every(p => p.fc[i].basis === 'last year') ? 'last year' : 'mixed' });
  }
  return { weeks: out, per: per, locs: locs };
}

function fcExplainGroup(adj, taperPct) {
  const g = fcForecastGroup(adj, taperPct);
  const parts = g.per.map(p => {
    const base = fcDefaultGrowth(p.name);
    const tot = p.fc.reduce((a, f) => a + f.value, 0);
    return `   ${p.name}: ${base + (adj || 0) > 0 ? '+' : ''}${base + (adj || 0)}% growth, EUR ${Math.round(tot).toLocaleString('nl-NL')}`;
  }).join('\n');
  return `How this forecast is built
Each location is forecast on its own history and the four are added up. It is deliberately NOT a forecast of the Consolidated row: that row compares this autumn against an autumn when Spui did not exist yet, which lands every week roughly 15% too low.

Per location over the next ${FC_HORIZON} weeks:
${parts}

Per location the method is: seasonal shape from the full years of history, base level from the last ${FC_BASE_WEEKS} weeks corrected for season, and growth versus the same week last year. Growth fades over the horizon (${taperPct != null ? taperPct : FC_TAPER_DEFAULT}% gone by week ${FC_HORIZON}) rather than being assumed to hold.

Not in the model: weather, holidays, price changes, a new location opening. Treat it as the trend line, not a promise.`;
}

// ---------------------------------------------------------------------------
// Recent run-rate versus the same weeks a year earlier.
//
// This replaces a hand-set growth number with something the data can defend:
// "over the last 13 weeks we ran X% above the same 13 weeks last year". Because
// it compares like weeks with like weeks, the season cancels out of the
// comparison -- which the old "vs the previous 13 weeks" delta did not, so a
// perfectly healthy autumn read as a 13% decline simply because summer is
// busier.
// ---------------------------------------------------------------------------
function fcRecentVsLastYear(name, n) {
  n = n || FC_HORIZON;
  const act = fcActuals(name);
  if (!act.length) return null;
  const m = {}; act.forEach(s => { m[fcKey(s.year, s.week)] = s.revenue; });
  const recent = act.slice(-n);
  let cur = 0, prev = 0, matched = 0;
  recent.forEach(s => {
    const ly = m[fcKey(s.year - 1, s.week)];
    if (ly) { cur += s.revenue; prev += ly; matched++; }
  });
  // Below two thirds coverage the comparison is a handful of weeks pretending
  // to be a trend, so it is refused rather than shown with a caveat nobody reads.
  if (!prev || matched < Math.ceil(n * 2 / 3)) return { pct: null, matched: matched, of: recent.length, cur: cur, prev: prev };
  return { pct: (cur / prev - 1) * 100, matched: matched, of: recent.length, cur: cur, prev: prev };
}

// Last year's revenue over the weeks this forecast covers -- the benchmark the
// forecast should be judged against, instead of against the summer we just had.
function fcHorizonLastYear(name) {
  const act = fcActuals(name);
  if (!act.length) return { total: 0, matched: 0 };
  const m = {}; act.forEach(s => { m[fcKey(s.year, s.week)] = s.revenue; });
  const last = act[act.length - 1];
  let y = last.year, w = last.week, total = 0, matched = 0;
  for (let i = 0; i < FC_HORIZON; i++) {
    w++; if (w > 52) { w = 1; y++; }
    const ly = m[fcKey(y - 1, w)];
    if (ly) { total += ly; matched++; }
  }
  return { total: total, matched: matched };
}

// Pooled run-rate of every location that HAS a comparison year: their revenue
// over the last stretch against the same weeks a year earlier, added up first
// and divided once. A location that opened mid-series has no year to compare
// with, and inventing a number for it would be worse than borrowing the one
// the rest of the business is actually running at.
function fcPeerGrowth(win) {
  let cur = 0, prev = 0; const names = [];
  ['Weteringschans', 'Jordaan', 'Cuyp', 'Spui'].forEach(n => {
    const r = fcRecentVsLastYear(n, win);
    if (r && r.pct != null) { cur += r.cur; prev += r.prev; names.push(n); }
  });
  if (!prev) return null;
  return { pct: (cur / prev - 1) * 100, names: names };
}

// The growth a location starts on: its own measured run-rate when it has one,
// otherwise the pooled rate of the locations that do -- flagged as borrowed, so
// nobody mistakes it for something Spui itself demonstrated. It switches to its
// own figure automatically the week enough comparison history exists.
function fcGrowthBasis(name, win) {
  const r = fcRecentVsLastYear(name, win);
  if (r && r.pct != null) return { pct: Math.round(r.pct), source: 'own', detail: r };
  const peer = fcPeerGrowth(win);
  if (peer) return { pct: Math.round(peer.pct), source: 'peers', peers: peer.names, detail: r };
  const fb = FC_GROWTH_DEFAULT[name] ?? fcAutoGrowth(fcActuals(name)) ?? 0;
  return { pct: fb, source: 'fallback', detail: r };
}
function fcDefaultGrowth(name, win) { return fcGrowthBasis(name, win).pct; }

// One sentence that shows the reasoning instead of just the outcome.
function fcGrowthSentence(name, growthPct, taperPct) {
  const r = fcRecentVsLastYear(name);
  const ly = fcHorizonLastYear(name);
  const g = growthPct != null ? growthPct : fcDefaultGrowth(name);
  const t = taperPct != null ? taperPct : FC_TAPER_DEFAULT;
  const fc = fcForecast(name, g, t);
  const tot = fc.reduce((a, f) => a + f.value, 0);
  const eur = v => 'EUR ' + Math.round(v).toLocaleString('nl-NL');
  if (r && r.pct != null && ly.matched >= Math.ceil(FC_HORIZON * 2 / 3)) {
    return `Over the last ${r.matched} weeks revenue ran ${r.pct >= 0 ? '+' : ''}${r.pct.toFixed(1)}% against the same weeks a year earlier (${eur(r.cur)} vs ${eur(r.prev)}). `
      + `Those same ${ly.matched} weeks last year came to ${eur(ly.total)}. Carrying ${g >= 0 ? '+' : ''}${g}% forward, fading to ${Math.round(g * (1 - t / 100))}% by week ${FC_HORIZON}, gives ${eur(tot)}.`;
  }
  const basis = fcGrowthBasis(name);
  if (basis.source === 'peers') {
    return `${name} has no comparison year yet${r && r.of ? ` (${r.matched} of ${r.of} weeks match)` : ''}, so it borrows the growth the rest of the business is running at: ${basis.pct >= 0 ? '+' : ''}${basis.pct}%, measured over ${basis.peers.join(', ')} against the same weeks last year. Applied to its own seasonal shape and recent level that gives ${eur(tot)}. It switches to its own figure as soon as there is a year to compare with.`;
  }
  return `Not enough matching weeks a year earlier to measure a run-rate${r ? ` (${r.matched} of ${r.of})` : ''}, so the forecast falls back on the seasonal shape and a growth rate of ${g >= 0 ? '+' : ''}${g}%: ${eur(tot)}.`;
}

// ---------------------------------------------------------------------------
// Backtest: how well has this model actually done?
//
// Rewind to the week where the current horizon began, hide everything after it,
// run the identical model, and compare its answer with what really happened.
// No stored predictions needed -- the history is the record. It re-runs on
// every page load, so the accuracy figure sharpens by itself every week.
// ---------------------------------------------------------------------------
function fcBacktest(name, taperPct) {
  const all = ((DATA.weekly || {})[name] || []).filter(s => s.revenue);
  if (all.length < FC_HORIZON * 2 + 4) return null;
  const cutIdx = all.length - 1 - FC_HORIZON;
  const cut = all[cutIdx];
  const cutKey = fcKey(cut.year, cut.week);
  const prevBlend = FC_BLENDED;
  FC_CUT = cutKey; FC_BLENDED = null;
  let predicted;
  try { predicted = fcForecast(name, fcDefaultGrowth(name), taperPct); }
  finally { FC_CUT = null; FC_BLENDED = prevBlend; }
  const actualMap = {}; all.forEach(s => { actualMap[fcKey(s.year, s.week)] = s.revenue; });
  let pred = 0, act = 0, weeks = 0;
  predicted.forEach(f => {
    const a = actualMap[fcKey(f.year, f.week)];
    if (a != null) { pred += f.value; act += a; weeks++; }
  });
  if (!weeks || !act) return null;
  return { weeks: weeks, predicted: pred, actual: act, errPct: (pred / act - 1) * 100,
           from: `${cut.year}-W${String(cut.week).padStart(2, '0')}` };
}

function fcBacktestSentence(name, taperPct) {
  const b = fcBacktest(name, taperPct);
  if (!b) return 'Not enough history yet to test the model against itself — the accuracy check appears once there are two full horizons of data.';
  const eur = v => 'EUR ' + Math.round(v).toLocaleString('nl-NL');
  const dir = b.errPct >= 0 ? 'over' : 'under';
  return `Track record: run on the data as it stood at ${b.from}, this model predicted ${eur(b.predicted)} for the ${b.weeks} weeks that have since happened. Actual: ${eur(b.actual)} — ${dir}shot by ${Math.abs(b.errPct).toFixed(1)}%.`;
}

// Group version: sum the locations, same rewind.
function fcBacktestGroup(taperPct) {
  const locs = ['Jordaan', 'Cuyp', 'Weteringschans', 'Spui'];
  let pred = 0, act = 0, weeks = 0, from = null;
  locs.forEach(n => {
    const b = fcBacktest(n, taperPct);
    if (!b) return;
    pred += b.predicted; act += b.actual; weeks = Math.max(weeks, b.weeks); from = from || b.from;
  });
  if (!act) return null;
  return { weeks: weeks, predicted: pred, actual: act, errPct: (pred / act - 1) * 100, from: from };
}

// ---------------------------------------------------------------------------
// The group as one series. Summing the four locations per week gives a single
// history that can be forecast in its own right -- worth testing, because
// errors in opposite directions cancel out in a total and a pooled model is
// often steadier than the sum of four noisy ones. Which is actually better is
// measured below, not assumed.
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// Self-tuning.
//
// Rewind to several points in the past, forecast from each with a given
// setting, and score it against what actually happened. The setting with the
// smallest average error is the one used now. Because the windows move forward
// every week, the tuning refreshes itself without anyone touching it.
//
// Two knobs only -- how fast growth fades, and how many weeks the run-rate is
// measured over. Deliberately not more: with roughly five independent test
// windows in this history, tuning more than two things fits the noise and makes
// the forecast worse while looking more scientific.
// ---------------------------------------------------------------------------
// Tuning is scored over EVERY historical starting point with a full horizon
// after it, not a handful. Scoring on four windows picked settings that looked
// twice as good as they turned out to be -- textbook overfitting, caught by
// re-running the same tuning over all 48 windows.
const FC_TUNE_WINDOWS = [8, 13, 26];
const FC_TUNE_TAPERS = [0, 25, 50, 75, 100];
const FC_TUNE_STEP = 2;      // every other week; enough coverage at a fraction of the work
const FC_TUNE_MIN_TESTS = 10;

function fcSeriesFor(name) { return name === FC_GROUP ? fcGroupSeries() : ((DATA.weekly || {})[name] || []).filter(s => s.revenue); }

// One backtest at a chosen distance back, with explicit settings.
function fcScoreAt(name, backWeeks, win, taperPct) {
  const all = fcSeriesFor(name);
  const cutIdx = all.length - 1 - backWeeks;
  if (cutIdx < FC_HORIZON + 8) return null;          // not enough history before the cut
  const cut = all[cutIdx];
  const prevBlend = FC_BLENDED, prevCut = FC_CUT;
  FC_CUT = fcKey(cut.year, cut.week); FC_BLENDED = null;
  let predicted;
  try { predicted = fcForecast(name, fcDefaultGrowth(name, win), taperPct); }
  finally { FC_CUT = prevCut; FC_BLENDED = prevBlend; }
  const actual = {}; all.forEach(s => { actual[fcKey(s.year, s.week)] = s.revenue; });
  let pred = 0, act = 0, weeks = 0;
  predicted.forEach(f => {
    const a = actual[fcKey(f.year, f.week)];
    if (a != null) { pred += f.value; act += a; weeks++; }
  });
  if (weeks < Math.ceil(FC_HORIZON / 2) || !act) return null;
  return { pred: pred, act: act, err: (pred / act - 1) * 100, weeks: weeks, at: `${cut.year}-W${String(cut.week).padStart(2, '0')}` };
}

let FC_TUNE_CACHE = {};
function fcTuneCuts(name) {
  const n = fcSeriesFor(name).length;
  const out = [];
  for (let back = FC_HORIZON; back <= n - FC_HORIZON - 10; back += FC_TUNE_STEP) out.push(back);
  return out;
}

function fcTune(name) {
  if (FC_TUNE_CACHE[name]) return FC_TUNE_CACHE[name];
  const cuts = fcTuneCuts(name);
  let best = null, plain = null;
  FC_TUNE_WINDOWS.forEach(win => {
    FC_TUNE_TAPERS.forEach(tp => {
      const errs = [];
      cuts.forEach(b => { const s = fcScoreAt(name, b, win, tp); if (s) errs.push(s.err); });
      if (errs.length < FC_TUNE_MIN_TESTS) return;
      const mape = errs.reduce((a, b) => a + Math.abs(b), 0) / errs.length;
      const bias = errs.reduce((a, b) => a + b, 0) / errs.length;
      const cand = { win: win, taper: tp, mape: mape, bias: bias, tested: errs.length };
      if (!best || mape < best.mape) best = cand;
      if (win === FC_HORIZON && tp === 50) plain = cand;   // closest grid point to the 55% default
    });
  });
  const out = best || { win: FC_HORIZON, taper: FC_TAPER_DEFAULT, mape: null, bias: null, tested: 0 };
  out.plain = plain;   // what the untuned defaults would have scored, for comparison
  FC_TUNE_CACHE[name] = out;
  return out;
}

// Sum of the tuned locations versus one tuned pooled model, scored the same way.
let FC_GROUP_CHOICE = null;
function fcGroupMethod() {
  if (FC_GROUP_CHOICE) return FC_GROUP_CHOICE;
  const locs = ['Jordaan', 'Cuyp', 'Weteringschans', 'Spui'].filter(n => fcSeriesFor(n).length >= FC_HORIZON * 2);
  // Same walk-forward grid as the tuner, so the two methods are compared on
  // identical ground rather than on whichever windows flatter one of them.
  const cuts = fcTuneCuts(FC_GROUP);
  const sumErrs = [];
  cuts.forEach(b => {
    let pred = 0, act = 0, ok = 0;
    locs.forEach(n => {
      const tn = fcTune(n);
      const s = fcScoreAt(n, b, tn.win, tn.taper);
      if (s) { pred += s.pred; act += s.act; ok++; }
    });
    if (ok === locs.length && act) sumErrs.push(Math.abs((pred / act - 1) * 100));
  });
  const gt = fcTune(FC_GROUP);
  const poolErrs = [];
  cuts.forEach(b => { const s = fcScoreAt(FC_GROUP, b, gt.win, gt.taper); if (s) poolErrs.push(Math.abs(s.err)); });
  const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const sumM = mean(sumErrs), poolM = mean(poolErrs);
  const choice = (poolM != null && sumM != null && poolM < sumM) ? 'pooled' : 'sum';
  FC_GROUP_CHOICE = { method: choice, sumMape: sumM, pooledMape: poolM, tuned: gt, tested: Math.max(sumErrs.length, poolErrs.length) };
  return FC_GROUP_CHOICE;
}

function fcTuneSentence(name) {
  const t = fcTune(name);
  if (t.mape == null) return 'Not enough history yet to tune the model — standard settings are used until there are at least ' + FC_TUNE_MIN_TESTS + ' test windows.';
  const better = t.plain && t.plain.mape > t.mape
    ? ` (the untuned defaults would have been ${t.plain.mape.toFixed(1)}%)` : '';
  const bias = t.bias != null && Math.abs(t.bias) > 3
    ? ` It leans ${t.bias < 0 ? 'low' : 'high'} by ${Math.abs(t.bias).toFixed(1)}% on average — the misses are structural (a delivery channel added, a location opened), not a fixable offset, so they are shown rather than silently corrected.` : '';
  return `Self-tuned over ${t.tested} historical starting points: run-rate measured over ${t.win} weeks, growth fading ${t.taper}% by week ${FC_HORIZON}. Average miss in those tests: ${t.mape.toFixed(1)}%${better}.${bias}`;
}

// The plainest reading there is: whatever the same week did last year, lifted
// by how the week just gone compares with its counterpart a year earlier. One
// week of evidence, one multiplication -- noisy by construction, but there is
// nothing in it to misunderstand, and that is the point of having it.
function fcLastYearIndex(name) {
  const act = fcActuals(name);
  if (act.length < 2) return null;
  const m = {}; act.forEach(s => { m[fcKey(s.year, s.week)] = s.revenue; });
  const last = act[act.length - 1];
  const ly = m[fcKey(last.year - 1, last.week)];
  if (!ly) return { pct: null, cur: last.revenue, prev: null, week: `${last.year}-W${String(last.week).padStart(2, '0')}` };
  return { pct: (last.revenue / ly - 1) * 100, cur: last.revenue, prev: ly,
           week: `${last.year}-W${String(last.week).padStart(2, '0')}` };
}

function fcBasicSentence(name) {
  const r = fcLastYearIndex(name);
  const eur = v => 'EUR ' + Math.round(v).toLocaleString('nl-NL');
  if (!r) return 'No history yet.';
  if (r.pct == null) return `Week ${r.week} did ${eur(r.cur)}, but that week did not exist a year ago — so there is nothing to index against and this view falls back on the seasonal shape.`;
  const g = Math.round(r.pct);
  const fc = fcForecast(name, g, 0);
  const tot = fc.reduce((a, f) => a + f.value, 0);
  return `Week ${r.week} did ${eur(r.cur)} against ${eur(r.prev)} the same week last year: ${g >= 0 ? '+' : ''}${g}%. Every coming week is last year's figure lifted by that same ${g >= 0 ? '+' : ''}${g}%, with nothing else added — ${eur(tot)} over ${FC_HORIZON} weeks.`;
}

// Walk forward from where we are now, taking each week-on-week step the way
// last year took it. Algebraically this equals "last year's week x how we
// compare with last year", but written as a chain it shows the steps -- and a
// step you can see is a step someone can disagree with.
//
// Anchored on the last completed week by default. One week is a noisy anchor,
// so the caller can pass an average of the last few instead; the sentence says
// which was used.
const FC_LOCS = ['Jordaan', 'Cuyp', 'Weteringschans', 'Spui'];
function fcMap(n) { const m = {}; fcActuals(n).forEach(s => { m[fcKey(s.year, s.week)] = s.revenue; }); return m; }
const FC_CHAIN_HORIZON = 6;  // planning window: six weeks out, not thirteen
function fcChainLastYear(name, anchorWeeks) {
  const act = fcActuals(name);
  if (act.length < 2) return null;
  const m = {}; act.forEach(s => { m[fcKey(s.year, s.week)] = s.revenue; });
  const last = act[act.length - 1];
  const n = anchorWeeks || 1;
  const tail = act.slice(-n);
  const base = tail.reduce((a, s) => a + s.revenue, 0) / tail.length;
  const steps = [];
  let y = last.year, w = last.week, prevW = last.week, prevY = last.year, level = base, chained = 1;
  for (let i = 0; i < FC_CHAIN_HORIZON; i++) {
    w++; if (w > 52) { w = 1; y++; }
    const lyPrev = m[fcKey(prevY - 1, prevW)];
    const lyNow = m[fcKey(y - 1, w)];
    // No pair for this step (Spui has no comparison year)? Borrow the average
    // move the other locations made that same week a year ago. Holding flat
    // would be a worse lie: it claims the season does nothing.
    let step = (lyPrev && lyNow) ? lyNow / lyPrev : null;
    let borrowed = false;
    if (step == null) {
      const peers = [];
      FC_LOCS.forEach(o => {
        if (o === name) return;
        const om = fcMap(o);
        const a = om[fcKey(prevY - 1, prevW)], b = om[fcKey(y - 1, w)];
        if (a && b) peers.push(b / a);
      });
      if (peers.length) { step = peers.reduce((x, v) => x + v, 0) / peers.length; borrowed = true; }
      else step = 1;
    }
    chained *= step;
    level = base * chained;
    steps.push({ year: y, week: w, value: Math.max(0, level), stepPct: (step - 1) * 100,
                 known: !!(lyPrev && lyNow), borrowed });
    prevW = w; prevY = y;
  }
  return { base, anchorWeeks: n, anchorLabel: n === 1
      ? `${last.year}-W${String(last.week).padStart(2, '0')}`
      : `the last ${n} weeks`, steps };
}

function fcChainSentence(name, anchorWeeks) {
  const c = fcChainLastYear(name, anchorWeeks);
  if (!c) return 'No history yet.';
  const eur = v => 'EUR ' + Math.round(v).toLocaleString('nl-NL');
  const tot = c.steps.reduce((a, s) => a + s.value, 0);
  const missing = c.steps.filter(s => !s.known).length;
  const borrowed = c.steps.filter(s => s.borrowed).length;
  const up = c.steps.filter(s => s.stepPct > 0).length;
  return `Starting from ${eur(c.base)} (${c.anchorLabel}) and taking each week-on-week move the way last year took it: `
    + `${up} of ${c.steps.length} weeks went up a year ago, and the same pattern applied here gives ${eur(tot)} over the next ${FC_CHAIN_HORIZON} weeks.`
    + (borrowed ? ` This location has no comparison year, so all ${borrowed} weekly moves are the average of Weteringschans, Jordaan and Cuyp — the level is ours, the shape is theirs.`
       : missing ? ` ${missing} week${missing === 1 ? '' : 's'} had no counterpart last year and are carried flat.` : '')
    + ` No growth assumption is added on top — this is last year's shape, nothing else.`;
}

// ===========================================================================
// FORECAST LOG
// ---------------------------------------------------------------------------
// Every forecast we publish is written to a Drive-backed store, append-only.
// The point is not the forecast, it's the record: in three months this is the
// only thing that can answer "how good are we at this?" without us being able
// to quietly move the goalposts.
//
// An entry is keyed run|loc|date, where run = "<origin week>|<level>". So one
// honest record per origin week per level per target week -- log the same week
// twice and the second one is dropped rather than overwriting the first.
// ===========================================================================
const FCLOG_URL = 'https://script.google.com/macros/s/AKfycbzwmT7Y2QFvLO53hAtFlEYDCiWWt2ZZ8KRh7qFlQ0vbv-TqD1T9WViZzvP-VBuZ2j9f/exec';
const FCLOG_KEY = 'KAM3aoHLiGK_x7R8gLPhX87WvQ47vTbz';
const FC_LEVELS = { basic: "Last year's weekly steps", data: '13-week run-rate', pro: 'Advanced model' };

let fcLogStore = null;                       // { entries: [...] } once fetched
let fcLogUI = { state: 'idle', msg: '' };    // idle | loading | saving | ok | err

function fcEur(v) { return '€ ' + Math.round(v).toLocaleString('nl-NL'); }
function fcWkKey(y, w) { return y + '-W' + String(w).padStart(2, '0'); }

// The week every forecast is measured from: the last week that is complete at
// every location. Using each location's own last week would let a location
// that lags a week look better than it is.
function fcOriginWeek() {
  let best = null;
  FC_LOCS.forEach(n => {
    const a = fcActuals(n);
    if (!a.length) return;
    const s = a[a.length - 1], k = s.year * 100 + s.week;
    if (best == null || k < best.k) best = { k, year: s.year, week: s.week };
  });
  return best;
}

// What each of the three levels predicts right now, per location plus the
// group as the sum. Returns [{level, loc, date, value}].
function fcAllPredictions() {
  const out = [];
  const push = (level, loc, series) => series.forEach(s =>
    out.push({ level, loc, date: fcWkKey(s.year, s.week), value: Math.round(s.value) }));
  const group = {};
  const addGroup = (level, series) => series.forEach(s => {
    const k = level + '|' + fcWkKey(s.year, s.week);
    group[k] = (group[k] || 0) + s.value;
  });

  FC_LOCS.forEach(loc => {
    const c = fcChainLastYear(loc, 1);
    if (c) { push('basic', loc, c.steps); addGroup('basic', c.steps); }

    const b = fcGrowthBasis(loc, FC_HORIZON);
    const tune = (typeof fcTune === 'function') ? fcTune(loc) : { taper: 0 };
    const d = fcForecast(loc, b.pct != null ? Math.round(b.pct) : 0, tune.taper);
    if (d && d.length) { push('data', loc, d); addGroup('data', d); }

    if (typeof fpForecast === 'function') {
      const p = fpForecast(loc);
      if (p && p.length) {
        const s = p.map(x => ({ year: x.year, week: x.week, value: x.p50 }));
        push('pro', loc, s); addGroup('pro', s);
      }
    }
  });
  Object.keys(group).forEach(k => {
    const [level, date] = k.split('|');
    out.push({ level, loc: 'Group', date, value: Math.round(group[k]) });
  });
  return out;
}

async function fcLogFetch() {
  if (fcLogStore) return fcLogStore;
  fcLogUI.state = 'loading';
  try {
    const r = await fetch(FCLOG_URL + '?key=' + encodeURIComponent(FCLOG_KEY)
      + '&mode=forecast_log&nocache=' + Date.now());   // Apps Script replays a
    // cached echo for an identical URL, so every read gets its own cache-buster
    fcLogStore = JSON.parse(await r.text());
    if (!fcLogStore.entries) fcLogStore.entries = [];
    fcLogUI.state = 'idle';
  } catch (e) {
    fcLogStore = { entries: [] };
    fcLogUI = { state: 'err', msg: 'Could not read the log: ' + e.message };
  }
  return fcLogStore;
}

async function fcLogSave(by) {
  const origin = fcOriginWeek();
  if (!origin) return;
  const originKey = fcWkKey(origin.year, origin.week);
  const at = new Date().toISOString();
  const entries = fcAllPredictions().map(p => ({
    run: originKey + '|' + p.level, loc: p.loc, date: p.date,
    level: p.level, origin: originKey, value: p.value, by: by || '', at,
  }));
  fcLogUI = { state: 'saving', msg: '' };
  fcLogRender();
  try {
    const r = await fetch(FCLOG_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },  // no CORS preflight
      body: JSON.stringify({ key: FCLOG_KEY, type: 'forecast_log', entries }),
    });
    const j = JSON.parse(await r.text());
    if (!j.ok) throw new Error(j.error || 'unexpected response');
    fcLogStore = null;
    await fcLogFetch();
    fcLogUI = { state: 'ok', msg: j.added
      ? `Logged ${j.added} predictions from ${originKey}. ${j.total} in the log.`
      : `Nothing added — ${originKey} was already logged. Entries are never overwritten.` };
  } catch (e) {
    fcLogUI = { state: 'err', msg: 'Could not write to the log: ' + e.message };
  }
  fcLogRender();
}

// Score every logged entry whose target week has since happened.
function fcScore() {
  if (!fcLogStore || !fcLogStore.entries.length) return null;
  const act = {};
  FC_LOCS.forEach(n => fcActuals(n).forEach(s => { act[n + '|' + fcWkKey(s.year, s.week)] = s.revenue; }));
  FC_LOCS.forEach(n => fcActuals(n).forEach(s => {
    const k = 'Group|' + fcWkKey(s.year, s.week);
    act[k] = (act[k] || 0) + s.revenue;
  }));
  const acc = {};
  fcLogStore.entries.forEach(e => {
    const a = act[e.loc + '|' + e.date];
    if (!a) return;                       // week hasn't happened yet
    const k = e.level + '|' + e.loc;
    const b = acc[k] || (acc[k] = { level: e.level, loc: e.loc, n: 0, absErr: 0, err: 0, act: 0 });
    b.n++; b.absErr += Math.abs(e.value - a); b.err += (e.value - a); b.act += a;
  });
  const rows = Object.values(acc).map(b => ({
    level: b.level, loc: b.loc, n: b.n,
    wape: b.act ? b.absErr / b.act * 100 : null,
    bias: b.act ? b.err / b.act * 100 : null,
  }));
  const pending = fcLogStore.entries.filter(e => !act[e.loc + '|' + e.date]).length;
  return { rows, pending, total: fcLogStore.entries.length };
}

function fcLogHtml() {
  const s = fcScore();
  const badge = fcLogUI.state === 'saving' ? 'Saving…'
    : fcLogUI.state === 'loading' ? 'Reading the log…' : '';
  let body;
  if (!fcLogStore) body = '<span class="fc-ref">reading the log…</span>';
  else if (!s) body = '<span class="fc-ref">The log is empty. Press <b>Log this week</b> and the record starts today — nothing can be scored until a logged week has actually happened.</span>';
  else if (!s.rows.length) body = `<span class="fc-ref">${s.total} predictions logged, none of them scoreable yet — the weeks they cover are still in the future. Come back once one has passed.</span>`;
  else {
    const byLevel = {};
    s.rows.forEach(r => (byLevel[r.level] = byLevel[r.level] || []).push(r));
    body = Object.keys(byLevel).map(lv => {
      const rows = byLevel[lv].sort((a, b) => (a.loc === 'Group' ? -1 : b.loc === 'Group' ? 1 : a.loc.localeCompare(b.loc)));
      return `<div class="fc-scoreblock"><b>${FC_LEVELS[lv] || lv}</b>`
        + '<table class="fc-table"><tr><th>Where</th><th style="text-align:right">Weeks scored</th>'
        + '<th style="text-align:right">Typical miss</th><th style="text-align:right">Leaning</th></tr>'
        + rows.map(r => `<tr><td>${r.loc}</td><td style="text-align:right">${r.n}</td>`
            + `<td style="text-align:right">${r.wape != null ? r.wape.toFixed(1) + '%' : '—'}</td>`
            + `<td style="text-align:right;color:${Math.abs(r.bias) < 2 ? 'var(--muted)' : r.bias > 0 ? 'var(--red)' : 'var(--green)'}">`
            + `${r.bias != null ? (r.bias > 0 ? '+' : '') + r.bias.toFixed(1) + '%' : '—'}</td></tr>`).join('')
        + '</table></div>';
    }).join('')
      + `<span class="fc-ref">${s.pending} logged prediction${s.pending === 1 ? '' : 's'} still waiting for its week to happen. `
      + 'Typical miss is how far off we were on average; leaning is the direction — a steady plus means we flatter ourselves.</span>';
  }
  return `
    <div class="fc-log">
      <div class="fc-loghead"><b>Track record</b> <span class="fc-ref">${badge}</span></div>
      ${body}
      <div class="fc-logctl">
        <input type="text" id="fcLogBy" placeholder="your name" value="${(fcLogUI.by || '')}">
        <button id="fcLogBtn"${fcLogUI.state === 'saving' ? ' disabled' : ''}>Log this week</button>
        <span class="fc-ref">writes all three levels for every location, append-only</span>
      </div>
      ${fcLogUI.msg ? `<div class="fc-logmsg ${fcLogUI.state}">${fcLogUI.msg}</div>` : ''}
    </div>`;
}

function fcLogBind(scope) {

  if (!btn) return;

// ===========================================================================
// ADVANCED FORECAST (layer 2)
// ===========================================================================
const FP = {
  HORIZON: 13,
  // 16 weeks, not 26: at 26 a location that opened this year contributes
  // nothing at all and gets no forecast either. The anchors already cope with
  // short history (they average what is there), so the extra ten weeks bought
  // tidiness at the price of excluding the shop that needs pooling most.
  MIN_ORIGIN: 16,
  LAMBDA: 3.0,           // ridge strength, chosen by walk-forward (see fpTune)
  HALFLIFE: 78,          // weeks; recent origins weigh more
  LOCS: ['Jordaan', 'Cuyp', 'Weteringschans', 'Spui'],
};

function fpSeries(name) { return ((DATA.weekly || {})[name] || []).filter(s => s.revenue > 0); }
function fpKey(y, w) { return y * 100 + w; }

// ---- calendar -------------------------------------------------------------
// Week-level flags. Dutch holidays are placed on their ISO week; the exact day
// matters less once revenue is aggregated weekly, but WHICH week carries
// Easter, Christmas or King's Day matters a great deal.
function fpEaster(y) {                       // Meeus/Jones/Butcher
  const a = y % 19, b = Math.floor(y / 100), c = y % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(Date.UTC(y, month - 1, day));
}
function fpIsoWeekOf(d) {
  const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  const ys = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return { year: t.getUTCFullYear(), week: Math.ceil((((t - ys) / 86400000) + 1) / 7) };
}
let FP_CAL = {};
function fpCalendar(year, week) {
  const k = fpKey(year, week);
  if (FP_CAL[k]) return FP_CAL[k];
  const flags = { holiday: 0, easter: 0, kingsday: 0, christmas: 0, summerVac: 0, mayVac: 0 };
  const e = fpEaster(year);
  const mark = (dt, key) => { const w = fpIsoWeekOf(dt); if (w.year === year && w.week === week) flags[key] = 1; };
  mark(e, 'easter');                                                    // Easter Sunday
  mark(new Date(e.getTime() + 39 * 864e5), 'holiday');                  // Ascension
  mark(new Date(e.getTime() + 49 * 864e5), 'holiday');                  // Whitsun
  // King's Day moves to the 26th when the 27th is a Sunday.
  const kd = new Date(Date.UTC(year, 3, 27));
  mark(kd.getUTCDay() === 0 ? new Date(Date.UTC(year, 3, 26)) : kd, 'kingsday');
  mark(new Date(Date.UTC(year, 0, 1)), 'holiday');
  mark(new Date(Date.UTC(year, 11, 25)), 'christmas');
  mark(new Date(Date.UTC(year, 11, 26)), 'christmas');
  // School holidays: week ranges rather than exact dates -- close enough at
  // week resolution and it avoids maintaining three regional calendars.
  if (week >= 29 && week <= 35) flags.summerVac = 1;
  if (week === 18 || week === 19) flags.mayVac = 1;
  flags.holiday = Math.min(1, flags.holiday + flags.easter + flags.kingsday + flags.christmas);
  FP_CAL[k] = flags;
  return flags;
}

// ---- weather --------------------------------------------------------------
// All four shops are in Amsterdam, so one weather series serves them all.
// Filled by fpLoadWeather(); until then the model simply runs without it and
// says so, rather than silently using zeros.
let FP_WEATHER = null;        // { "YYYYww": {tmax, precip, sun, known} }
let FP_WEATHER_CLIMO = null;  // { week: {tmax, precip, sun} }
function fpWeatherFor(year, week) {
  const k = String(fpKey(year, week));
  if (FP_WEATHER && FP_WEATHER[k]) return FP_WEATHER[k];
  if (FP_WEATHER_CLIMO && FP_WEATHER_CLIMO[week]) return Object.assign({ known: 0 }, FP_WEATHER_CLIMO[week]);
  return null;
}

// ---- feature construction -------------------------------------------------
function fpAnchors(series, idx) {
  const mean = n => {
    const a = series.slice(Math.max(0, idx - n + 1), idx + 1);
    return a.length ? a.reduce((x, s) => x + s.revenue, 0) / a.length : null;
  };
  const m4 = mean(4), m13 = mean(13), m26 = mean(26), m52 = mean(52);
  if (!m4 || !m13) return null;
  const cur = series[idx];
  const lyIdx = series.findIndex(s => fpKey(s.year, s.week) === fpKey(cur.year - 1, cur.week));
  const ly4 = lyIdx >= 3 ? series.slice(lyIdx - 3, lyIdx + 1).reduce((x, s) => x + s.revenue, 0) / 4 : null;
  const logs = series.slice(Math.max(0, idx - 12), idx + 1).map(s => Math.log(s.revenue));
  let vol = 0;
  for (let i = 1; i < logs.length; i++) vol += Math.abs(logs[i] - logs[i - 1]);
  vol = logs.length > 1 ? vol / (logs.length - 1) : 0;
  return { level: m4, m13, m26, m52, trend: Math.log(m4 / m13), yoy: ly4 ? Math.log(m4 / ly4) : 0,
           hasYoy: ly4 ? 1 : 0, vol };
}

// One row: what we knew at `origin`, aimed at the week `h` steps later.
function fpRow(name, series, idx, h) {
  const a = fpAnchors(series, idx);
  if (!a) return null;
  const cur = series[idx];
  let y = cur.year, w = cur.week;
  for (let i = 0; i < h; i++) { w++; if (w > 52) { w = 1; y++; } }
  const cal = fpCalendar(y, w);
  const wx = fpWeatherFor(y, w);
  const ang = 2 * Math.PI * w / 52;
  const lyRow = series.find(s => fpKey(s.year, s.week) === fpKey(y - 1, w));
  const x = [
    1,                                        // intercept
    a.trend, a.yoy, a.hasYoy, a.vol,
    Math.log(a.level / a.m26), Math.log(a.m13 / (a.m52 || a.m13)),
    lyRow ? Math.log(lyRow.revenue / a.level) : 0,
    lyRow ? 1 : 0,
    Math.sin(ang), Math.cos(ang), Math.sin(2 * ang), Math.cos(2 * ang),
    cal.holiday, cal.easter, cal.kingsday, cal.christmas, cal.summerVac, cal.mayVac,
    h / FP.HORIZON, Math.pow(h / FP.HORIZON, 2),
    wx ? (wx.tmax - 15) / 10 : 0, wx ? Math.min(wx.precip, 40) / 20 : 0,
    wx ? wx.sun / 50 : 0, wx ? (wx.known ? 1 : 0) : 0,
    FP.LOCS.indexOf(name) === 0 ? 1 : 0, FP.LOCS.indexOf(name) === 1 ? 1 : 0,
    FP.LOCS.indexOf(name) === 2 ? 1 : 0,
  ];
  return { x, level: a.level, year: y, week: w, name, originIdx: idx };
}

// ---- ridge ----------------------------------------------------------------
// Normal equations with Gaussian elimination. At ~28 features this is instant
// and avoids pulling in a matrix library for something this small.
function fpRidge(X, yv, wv, lambda) {
  const n = X.length, p = X[0].length;
  const A = Array.from({ length: p }, () => new Float64Array(p));
  const b = new Float64Array(p);
  for (let i = 0; i < n; i++) {
    const xi = X[i], wi = wv[i];
    for (let j = 0; j < p; j++) {
      b[j] += wi * xi[j] * yv[i];
      for (let k = j; k < p; k++) A[j][k] += wi * xi[j] * xi[k];
    }
  }
  for (let j = 0; j < p; j++) { for (let k = 0; k < j; k++) A[j][k] = A[k][j]; if (j > 0) A[j][j] += lambda; }
  const M = A.map((row, i) => Array.from(row).concat([b[i]]));
  for (let c = 0; c < p; c++) {
    let piv = c;
    for (let r = c + 1; r < p; r++) if (Math.abs(M[r][c]) > Math.abs(M[piv][c])) piv = r;
    if (Math.abs(M[piv][c]) < 1e-10) continue;
    const t = M[c]; M[c] = M[piv]; M[piv] = t;
    for (let r = 0; r < p; r++) {
      if (r === c) continue;
      const f = M[r][c] / M[c][c];
      for (let k = c; k <= p; k++) M[r][k] -= f * M[c][k];
    }
  }
  return M.map((row, i) => Math.abs(row[i]) < 1e-10 ? 0 : row[p] / row[i]);
}
function fpDot(beta, x) { let s = 0; for (let i = 0; i < x.length; i++) s += beta[i] * x[i]; return s; }

// ---- training + prediction ------------------------------------------------
// Rows are pooled across locations. A shop that opened this year contributes
// what it can and borrows the shape of the rest through the shared coefficients
// -- which is exactly the problem Spui has under the simple model.
function fpBuildRows(cutKey) {
  const X = [], y = [], w = [], meta = [];
  FP.LOCS.forEach(name => {
    const all = fpSeries(name);
    const series = cutKey ? all.filter(s => fpKey(s.year, s.week) <= cutKey) : all;
    const byKey = {}; series.forEach(s => { byKey[fpKey(s.year, s.week)] = s.revenue; });
    for (let idx = FP.MIN_ORIGIN; idx < series.length; idx++) {
      for (let h = 1; h <= FP.HORIZON; h++) {
        const r = fpRow(name, series, idx, h);
        if (!r) continue;
        const target = byKey[fpKey(r.year, r.week)];
        if (!target) continue;                       // only rows we can score
        X.push(r.x);
        y.push(Math.log(target / r.level));          // the ratio, not the amount
        const age = series.length - 1 - idx;
        w.push(Math.pow(0.5, age / FP.HALFLIFE));
        meta.push(r);
      }
    }
  });
  return { X, y, w, meta };
}

let FP_MODEL = null;
function fpFit(cutKey, lambda) {
  const d = fpBuildRows(cutKey);
  if (d.X.length < 200) return null;
  return { beta: fpRidge(d.X, d.y, d.w, lambda == null ? FP.LAMBDA : lambda), rows: d.X.length };
}

// The naive benchmark: same week last year lifted by the recent year-on-year
// ratio, falling back to the recent level times the seasonal index. This is the
// simple model from layer 1, kept as the bar the clever one has to clear.
function fpNaive(name, series, idx, h) {
  const a = fpAnchors(series, idx);
  if (!a) return null;
  const cur = series[idx];
  let y = cur.year, w = cur.week;
  for (let i = 0; i < h; i++) { w++; if (w > 52) { w = 1; y++; } }
  const ly = series.find(s => fpKey(s.year, s.week) === fpKey(y - 1, w));
  const seas = fcStoreSeasonal(name);
  const val = ly ? ly.revenue * Math.exp(a.yoy) : a.level * (seas[w] || 1);
  return { year: y, week: w, value: Math.max(0, val) };
}

function fpPredict(name, model, cutKey) {
  const all = fpSeries(name);
  const series = cutKey ? all.filter(s => fpKey(s.year, s.week) <= cutKey) : all;
  const idx = series.length - 1;
  if (idx < FP.MIN_ORIGIN) return [];
  const out = [];
  for (let h = 1; h <= FP.HORIZON; h++) {
    const r = fpRow(name, series, idx, h);
    if (!r) continue;
    const ridge = model ? r.level * Math.exp(fpDot(model.beta, r.x)) : null;
    const nv = fpNaive(name, series, idx, h);
    out.push({ year: r.year, week: r.week, h, ridge, naive: nv ? nv.value : null, level: r.level });
  }
  return out;
}

// ---- walk-forward evaluation ---------------------------------------------
// Every origin is a fresh experiment: fit on what was known then, predict 13
// weeks, score against what happened. The ensemble weight is not chosen, it is
// whatever minimises WAPE across those experiments.
function fpWape(pairs) {
  let num = 0, den = 0;
  pairs.forEach(([p, a]) => { num += Math.abs(p - a); den += Math.abs(a); });
  return den ? num / den * 100 : null;
}

let FP_EVAL = null;
function fpEvaluate(step) {
  if (FP_EVAL) return FP_EVAL;
  step = step || 4;
  const ref = fpSeries('Weteringschans');
  const origins = [];
  for (let back = FP.HORIZON; back <= ref.length - FP.MIN_ORIGIN - FP.HORIZON; back += step) origins.push(back);
  const rows = [];              // {loc, h, ridge, naive, actual}
  origins.forEach(back => {
    const cutS = ref[ref.length - 1 - back];
    const cutKey = fpKey(cutS.year, cutS.week);
    const model = fpFit(cutKey);
    if (!model) return;
    FP.LOCS.forEach(name => {
      const all = fpSeries(name);
      const byKey = {}; all.forEach(s => { byKey[fpKey(s.year, s.week)] = s.revenue; });
      fpPredict(name, model, cutKey).forEach(p => {
        const a = byKey[fpKey(p.year, p.week)];
        if (a) rows.push({ loc: name, h: p.h, ridge: p.ridge, naive: p.naive, actual: a });
      });
    });
  });
  if (rows.length < 50) { FP_EVAL = { ok: false, n: rows.length }; return FP_EVAL; }
  // Blend weight by grid search -- transparent, and with one parameter there is
  // nothing to be gained from anything cleverer.
  let best = null;
  for (let wgt = 0; wgt <= 1.0001; wgt += 0.05) {
    const wape = fpWape(rows.filter(r => r.ridge != null && r.naive != null)
      .map(r => [wgt * r.ridge + (1 - wgt) * r.naive, r.actual]));
    if (wape != null && (!best || wape < best.wape)) best = { w: Math.round(wgt * 100) / 100, wape };
  }
  const blend = r => best.w * r.ridge + (1 - best.w) * r.naive;
  const scored = rows.filter(r => r.ridge != null && r.naive != null);
  const byWeek = [];
  for (let hw = 1; hw <= Math.ceil(FP.HORIZON / 4); hw++) {
    const sub = scored.filter(r => Math.ceil(r.h / 4) === hw);
    if (sub.length) byWeek.push({ block: hw, wape: fpWape(sub.map(r => [blend(r), r.actual])), n: sub.length });
  }
  const byLoc = FP.LOCS.map(n => {
    const sub = scored.filter(r => r.loc === n);
    return sub.length ? { loc: n, wape: fpWape(sub.map(r => [blend(r), r.actual])),
                          naive: fpWape(sub.map(r => [r.naive, r.actual])), n: sub.length } : null;
  }).filter(Boolean);
  // Residual spread per horizon block, for an honest band instead of a guessed one.
  const resid = {};
  scored.forEach(r => {
    const hw = Math.ceil(r.h / 4);
    (resid[hw] = resid[hw] || []).push(Math.log(r.actual / Math.max(1, blend(r))));
  });
  const q = (arr, p) => { const a = arr.slice().sort((x, y) => x - y); return a[Math.min(a.length - 1, Math.floor(p * a.length))]; };
  const bands = {};
  Object.keys(resid).forEach(hw => { bands[hw] = { lo: q(resid[hw], 0.10), hi: q(resid[hw], 0.90) }; });
  FP_EVAL = { ok: true, weight: best.w, wape: best.wape,
              naiveWape: fpWape(scored.map(r => [r.naive, r.actual])),
              ridgeWape: fpWape(scored.map(r => [r.ridge, r.actual])),
              byWeek, byLoc, bands, n: scored.length, origins: origins.length };
  return FP_EVAL;
}

// ---- the forecast the dashboard shows ------------------------------------
function fpForecast(name) {
  const ev = fpEvaluate();
  if (!FP_MODEL) FP_MODEL = fpFit(null);
  const preds = fpPredict(name, FP_MODEL, null);
  const wgt = ev.ok ? ev.weight : 0.5;
  return preds.map(p => {
    const mid = (p.ridge != null && p.naive != null) ? wgt * p.ridge + (1 - wgt) * p.naive : (p.ridge ?? p.naive);
    const hw = Math.ceil(p.h / 4);
    const b = ev.ok && ev.bands[hw] ? ev.bands[hw] : { lo: -0.15, hi: 0.15 };
    return { year: p.year, week: p.week, h: p.h,
             p50: Math.max(0, mid), p10: Math.max(0, mid * Math.exp(b.lo)), p90: Math.max(0, mid * Math.exp(b.hi)),
             ridge: p.ridge, naive: p.naive };
  });
}


const LOCATIONS = DATA.locations;
let state = { loc: LOCATIONS[0], section: 'overview', period: 13, customFrom: null, customTo: null, baristaBasis: 'drink' };
const LOC_BADGES = {}; // e.g. {Jordaan:'JOR'} -- computed once below
LOCATIONS.forEach(l => { LOC_BADGES[l] = l.slice(0,3).toUpperCase(); });
const PERIOD_OPTIONS = [
  {label:'8 weeks', value:8}, {label:'13 weeks', value:13}, {label:'26 weeks', value:26}, {label:'All', value:9999}, {label:'Custom range', value:'custom'},
];

function fmtEur(v) { return v == null ? '—' : '€' + Math.round(v).toLocaleString('en-GB'); }
function fmtEur1(v) { return v == null ? '—' : '€' + v.toLocaleString('en-GB', {maximumFractionDigits:1}); }
function fmtPct(v) { return v == null ? '—' : (v*100).toFixed(1) + '%'; }
function fmtNum(v, d) { return v == null ? '—' : v.toLocaleString('en-GB', {maximumFractionDigits: d==null?1:d}); }
function starString(r) {
  const full = Math.round(r);
  return '★★★★★'.slice(0,full) + '☆☆☆☆☆'.slice(0, 5-full);
}

function locWeeks(loc) { return DATA.weekly[loc] || []; }
function lastNWeeks(loc, n) { const w = locWeeks(loc); return n >= w.length ? w : w.slice(-n); }
function wkKey(w) { return w.year + '-W' + String(w.week).padStart(2,'0'); }
// Either the fixed lookback (8/13/26/All weeks) or, when state.period ===
// 'custom', an explicit [customFrom, customTo] ISO-week range picked per
// location from the dropdowns in buildPeriodChips. Falls back to the full
// history if a custom range hasn't been picked yet (e.g. right after
// switching to "Custom range" for the first time).
function weeksInPeriod(loc) {
  const all = locWeeks(loc);
  if (state.period === 'custom') {
    if (!state.customFrom || !state.customTo) return all;
    let lo = state.customFrom, hi = state.customTo;
    if (lo > hi) { const t = lo; lo = hi; hi = t; }
    return all.filter(w => { const k = wkKey(w); return k >= lo && k <= hi; });
  }
  return lastNWeeks(loc, state.period);
}
// The most recent calendar week often has revenue but not yet hours/labor/
// items entered (those lag a few days behind the POS close) -- KPI cards
// should reference the latest week that actually has the field filled in,
// not literally the last row, so the headline numbers don't go blank the
// moment a new week appears. Trend charts still show the full range with
// gaps (spanGaps:true), so the lag itself stays visible there.
function latestWithField(weeks, field) {
  for (let i = weeks.length - 1; i >= 0; i--) {
    if (weeks[i][field] != null) return weeks[i];
  }
  return weeks[weeks.length - 1] || {};
}

function buildLocationChips() {
  const el = document.getElementById('locationChips');
  el.innerHTML = LOCATIONS.map(l => `<div class="chip${l===state.loc?' active':''}" data-loc="${l}">${l}</div>`).join('');
  el.querySelectorAll('.chip').forEach(chip => {
    chip.onclick = () => { state.loc = chip.dataset.loc; renderAll(); };
  });
}

function buildSectionTabs() {
  const tabs = [
    {key:'overview', label:'Overview'},
