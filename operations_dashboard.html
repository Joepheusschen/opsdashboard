// ---------------- OVERVIEW (all locations, Forksight-style cards) ----------------
// Delta badge: `mode:'pp'` compares two already-percentage values as
// percentage-points (e.g. COGS% 31.2 -> 32.4 shows "+1.2pp"); default mode
// compares two euro/count values as a relative % change. `invert:true` means
// an increase is BAD (e.g. a cost %) so the up/down color flips accordingly
// (green still always means "good direction", not just "went up").
function deltaBadge(cur, prev, opts) {
  opts = opts || {};
  if (cur == null || prev == null) return '';
  let d;
  if (opts.mode === 'pp') {
    d = (cur - prev) * 100;
  } else {
    if (!prev) return '';
    d = (cur - prev) / Math.abs(prev) * 100;
  }
  if (!isFinite(d)) return '';
  if (Math.abs(d) < 0.05) return '<span class="metric-delta" style="color:var(--muted);">flat</span>';
  const positive = opts.invert ? d < 0 : d >= 0;
  const cls = positive ? 'up' : 'down';
  const arrow = d >= 0 ? '▲' : '▼';
  const suffix = opts.mode === 'pp' ? 'pp' : '%';
  return `<span class="metric-delta ${cls}">${arrow} ${Math.abs(d).toFixed(1)}${suffix}</span>`;
}
// One P&L-style line: label + delta badge, right-aligned value + %-of-revenue,
// with an optional thin colored ratio bar underneath (used for cost lines).
function metricRow(label, valStr, deltaHtml, pctStr, ratioPct, ratioClass) {
  const bar = ratioPct != null ? `<div class="metric-ratio-track"><div class="metric-ratio-fill ${ratioClass||'c-accent'}" style="width:${Math.max(0,Math.min(100,ratioPct))}%"></div></div>` : '';
  return `<div>
    <div class="metric-row">
      <span class="metric-lbl">${label}</span>${deltaHtml}
      <span class="metric-spacer"></span>
      <span class="metric-val">${valStr}</span>
      ${pctStr != null ? `<span class="metric-pct">${pctStr}</span>` : ''}
    </div>
    ${bar}
  </div>`;
}
// ---------------- BUSINESS THERMOMETER ----------------
// A single 0-100 read on "how healthy is this business right now", built from
// six components that each already have an agreed target elsewhere in this
// dashboard -- so the thermometer never invents a standard, it only rolls up
// standards that are already being used. Two deliberate design choices:
//   1. Every component scores 100 when it MEETS its target, not when it hits
//      some theoretical perfect value. A 100 therefore means "everything is at
//      or better than the target we set", which is achievable, rather than an
//      abstract ideal nobody can reach.
//   2. Components with no data are DROPPED and the remaining weights are
//      renormalised, rather than being scored 0. A missing quality submission
//      is not the same as a bad one -- but the gauge says out loud which parts
//      it could not score, so a high score on thin data is never mistaken for
//      a high score on complete data.
const SCORE_WEIGHTS = { cogs:20, labor:20, productivity:20, revtrend:15, quality:15, reviews:10 };
// Linear 0-100 ramp: `zeroAt` scores 0, `fullAt` scores 100, clamped outside.
function scoreRamp(val, zeroAt, fullAt) {
  if (val == null || !isFinite(val) || zeroAt === fullAt) return null;
  const t = (val - zeroAt) / (fullAt - zeroAt);
  return Math.max(0, Math.min(1, t)) * 100;
}
function verdictOf(score) {
  if (score == null) return { label:'no data', color:'var(--muted)', bg:'var(--border-soft)' };
  if (score >= 80) return { label:'healthy', color:'var(--green)', bg:'var(--green-bg)' };
  if (score >= 60) return { label:'watch', color:'var(--gold)', bg:'#fbf3e3' };
  return { label:'needs action', color:'var(--red)', bg:'var(--red-bg)' };
}
// Revenue momentum: latest week against the average of the 4 weeks before it,
// which is steadier than a raw week-on-week delta (a single quiet week or a
// public holiday shouldn't swing the whole thermometer).
function revTrendPct(weeks, idx) {
  if (idx < 1) return null;
  const base = [];
  for (let i = Math.max(0, idx-4); i < idx; i++) if (weeks[i].revenue != null) base.push(weeks[i].revenue);
  if (!base.length || weeks[idx].revenue == null) return null;
  const avg = base.reduce((a,b)=>a+b,0) / base.length;
  if (!avg) return null;
  return (weeks[idx].revenue - avg) / avg * 100;
}
function anchorWeekIdx(weeks) {
  for (let i = weeks.length - 1; i >= 0; i--) {
    if (weeks[i].revenue != null && weeks[i].labor_pct != null && weeks[i].cogs_pct != null) return i;
  }
  return weeks.length - 1;
}
function medianOf(arr) {
  const a = arr.filter(v => v != null && isFinite(v)).slice().sort((x,y)=>x-y);
  if (!a.length) return null;
  const m = Math.floor(a.length/2);
  return a.length % 2 ? a[m] : (a[m-1] + a[m]) / 2;
}
// Purchase invoices land in the books days-to-weeks after the sales they
// belong to, so the most recent week's COGS is routinely UNDER-recorded --
// which would otherwise hand the thermometer a perfect purchasing score for
// the one reason we least want to reward: incomplete bookkeeping. If a week's
// COGS ratio sits far below that location's own recent norm, treat it as
// not-yet-complete and refuse to score it, rather than scoring it well.
// Same defensive spirit as the MIN_DAYS_COUNTED / MIN_REVENUE_RATIO guards on
// the opening-hours and AOV joins upstream.
// Calibrated against the actual history rather than picked by feel: at 0.70
// all four locations trip the guard on the newest week simultaneously -- the
// signature of a booking lag, since four independent shops do not all halve
// their food cost in the same week -- while the historical trigger rate stays
// around 15% of location-weeks. At 0.60 Weteringschans never trips at all
// (under-detection); at 0.80 the rate climbs toward a third of all weeks and
// starts discarding genuine good weeks.
const COGS_INCOMPLETE_RATIO = 0.70;
function cogsLooksIncomplete(cogsPct, priorCogsPcts) {
  if (cogsPct == null) return null;
  const med = medianOf(priorCogsPcts.slice(-8));
  if (med == null || !med) return null;
  return cogsPct < med * COGS_INCOMPLETE_RATIO
    ? `${fmtPct(cogsPct)} is far below this location's recent norm of ${fmtPct(med)} — purchase invoices for this week are almost certainly not all booked yet, so it is left unscored instead of being rewarded.`
    : null;
}
// Builds the six scored components for one location (or, when `agg` is passed,
// for the group as a whole using pre-summed figures).
function healthComponents(src) {
  const foodMax = DATA.fixed_targets.food_cost_max;
  const laborMax = DATA.fixed_targets.labor_cost_max;
  const prodMin = DATA.fixed_targets.productivity_min;
  const c = [];
  // A COGS figure flagged as not-yet-complete is dropped entirely (score and
  // `what` both null), which routes it into the "not scored" list with its
  // reason instead of into the scored roll-up.
  const cogsUsable = src.cogs_incomplete ? null : src.cogs_pct;
  c.push({ key:'cogs', label:'Purchasing cost', weight:SCORE_WEIGHTS.cogs,
    reason: src.cogs_incomplete || null,
    score: scoreRamp(cogsUsable, foodMax + 0.10, foodMax),
    what: cogsUsable != null ? `Purchasing is ${fmtPct(cogsUsable)} of revenue (target ≤ ${fmtPct(foodMax)}).` : null,
    fix: cogsUsable != null && cogsUsable > foodMax
      ? `Bringing it back to ${fmtPct(foodMax)} recovers these points — check supplier prices, portioning and waste.`
      : 'At or under target — but note this only counts the suppliers currently linked in the Excel, so true purchasing is higher.' });
  c.push({ key:'labor', label:'Labor cost', weight:SCORE_WEIGHTS.labor,
    score: scoreRamp(src.labor_pct, laborMax + 0.10, laborMax),
    what: src.labor_pct != null ? `Labor is ${fmtPct(src.labor_pct)} of revenue (target ≤ ${fmtPct(laborMax)}).` : null,
    fix: src.labor_pct != null && src.labor_pct > laborMax
      ? `Rostering to ${fmtPct(laborMax)} recovers these points — the usual lever is trimming overlap on the quietest shifts, not cutting peak cover.`
      : 'At or under target.' });
  c.push({ key:'productivity', label:'Productivity', weight:SCORE_WEIGHTS.productivity,
    score: scoreRamp(src.productivity, prodMin * 0.6, prodMin),
    what: src.productivity != null ? `${fmtEur1(src.productivity)} revenue per labor hour (target ≥ ${fmtEur(prodMin)}).` : null,
    fix: src.productivity != null && src.productivity < prodMin
      ? `Either more revenue in the same hours or the same revenue in fewer hours closes this gap.`
      : 'At or above target.' });
  c.push({ key:'revtrend', label:'Revenue momentum', weight:SCORE_WEIGHTS.revtrend,
    score: scoreRamp(src.rev_trend_pct, -10, 10),
    what: src.rev_trend_pct != null ? `Revenue is ${src.rev_trend_pct >= 0 ? '+' : ''}${src.rev_trend_pct.toFixed(1)}% vs its own previous 4-week average.` : null,
    fix: src.rev_trend_pct != null && src.rev_trend_pct < 0
      ? `Scored full only at +10% or better, half at flat — so a declining week always shows up here before it shows up in the cost ratios.`
      : 'Growing versus its own recent baseline.' });
  c.push({ key:'quality', label:'Weekly quality check', weight:SCORE_WEIGHTS.quality,
    score: src.quality_score != null ? Math.max(0, Math.min(100, src.quality_score)) : null,
    what: src.quality_score != null ? `Latest quality check scored ${src.quality_score.toFixed(1)} / 100${src.quality_week ? ' (' + src.quality_week + ')' : ''}.` : null,
    fix: 'Open the Quality tab to see which pillar is dragging the score down.' });
  c.push({ key:'reviews', label:'Google rating', weight:SCORE_WEIGHTS.reviews,
    score: scoreRamp(src.rating, 3.5, 4.8),
    what: src.rating != null ? `Google rating ${src.rating.toFixed(1)}★ (scored 0 at 3.5★, 100 at 4.8★).` : null,
    fix: 'The Service tab lists the specific recurring complaints behind this rating.' });
  return c;
}
// Rolls components into a single 0-100, renormalising over whatever could
// actually be scored, and returns the gap list already sorted by how many
// points each component is costing.
function rollUpHealth(components) {
  const scored = components.filter(c => c.score != null && c.what != null);
  const missing = components.filter(c => c.score == null || c.what == null);
  if (!scored.length) return { score:null, scored:[], missing, gaps:[] };
  const wSum = scored.reduce((a,c)=>a+c.weight, 0);
  const total = scored.reduce((a,c)=>a + c.score * c.weight, 0) / wSum;
  // Points lost is expressed on the renormalised scale, so the numbers in the
  // list add up to exactly (100 - score) rather than to some other total.
  const gaps = scored.map(c => ({ ...c, lost: (100 - c.score) / 100 * (c.weight / wSum * 100) }))
                     .sort((a,b) => b.lost - a.lost);
  return { score: total, scored, missing, gaps, weightCovered: wSum };
}
function healthForLocation(loc) {
  const weeks = locWeeks(loc);
  const idx = anchorWeekIdx(weeks);
  const w = weeks[idx] || {};
  const subs = (DATA.quality && DATA.quality[loc]) || {};
  const qWeeks = Object.keys(subs).sort();
  const qLatest = qWeeks.length ? subs[qWeeks[qWeeks.length-1]] : null;
  const rev = DATA.reviews[loc] || {};
  const priorCogs = weeks.slice(0, idx).map(x => x.cogs_pct);
  const h = rollUpHealth(healthComponents({
    cogs_pct: w.cogs_pct, cogs_incomplete: cogsLooksIncomplete(w.cogs_pct, priorCogs),
    labor_pct: w.labor_pct, productivity: w.productivity,
    rev_trend_pct: revTrendPct(weeks, idx),
    quality_score: qLatest ? qLatest.score : null,
    quality_week: qWeeks.length ? qWeeks[qWeeks.length-1] : null,
    rating: rev.rating,
  }));
  h.week = w.year ? (w.year + '-W' + String(w.week).padStart(2,'0')) : null;
  return h;
}
// Group score: built from summed euros across locations for the latest week
// all four have complete cost data, not from averaging the four location
// scores -- so a big location's cost overrun isn't diluted by three small ones.
function healthForGroup() {
  let common = null;
  const perLoc = {};
  LOCATIONS.forEach(l => { perLoc[l] = locWeeks(l); });
  const keysOf = (loc) => perLoc[loc].filter(w => w.revenue!=null && w.labor_pct!=null && w.cogs_pct!=null).map(wkKey);
  const sets = LOCATIONS.map(l => new Set(keysOf(l)));
  const firstList = keysOf(LOCATIONS[0]).sort();
  for (let i = firstList.length - 1; i >= 0; i--) {
    if (sets.every(s => s.has(firstList[i]))) { common = firstList[i]; break; }
  }
  if (!common) return { score:null, scored:[], missing:[], gaps:[], week:null, partial:true };
  let rev=0, inkoop=0, labor=0, hours=0, ratingNum=0, ratingDen=0;
  const qScores = [];
  const trendPcts = [];
  // Group-level equivalent of the per-location "are the invoices all in yet?"
  // guard: build the same summed COGS ratio for each of the prior weeks so the
  // aggregate can be compared against its own recent norm, not just eyeballed.
  const priorGroupCogs = [];
  const commonPriorKeys = keysOf(LOCATIONS[0]).sort().filter(k => k < common).slice(-8);
  commonPriorKeys.forEach(k => {
    let r=0, i=0, ok=true;
    LOCATIONS.forEach(loc => {
      const w = perLoc[loc].find(x => wkKey(x) === k);
      if (!w || w.revenue == null || w.cogs_pct == null) { ok = false; return; }
      r += w.revenue; i += (w.inkoop_total != null ? w.inkoop_total : w.cogs_pct * w.revenue);
    });
    if (ok && r) priorGroupCogs.push(i / r);
  });
  LOCATIONS.forEach(loc => {
    const weeks = perLoc[loc];
    const idx = weeks.findIndex(w => wkKey(w) === common);
    const w = weeks[idx];
    rev += w.revenue || 0;
    if (w.inkoop_total != null) inkoop += w.inkoop_total;
    else if (w.cogs_pct != null && w.revenue) inkoop += w.cogs_pct * w.revenue;
    if (w.labor_cost != null) labor += w.labor_cost;
    else if (w.labor_pct != null && w.revenue) labor += w.labor_pct * w.revenue;
    // Aggregate productivity from the per-location `productivity` field rather
    // than from summing raw `hours`: for Weteringschans the two disagree
    // (its `hours` column carries the central bakery's hours, which the
    // productivity figure deliberately excludes -- the same distinction behind
    // labor_cost_max_consolidated). Re-deriving the implied shop hours per
    // location keeps ONE definition of productivity across both dashboards.
    if (w.productivity && w.revenue) hours += w.revenue / w.productivity;
    const t = revTrendPct(weeks, idx);
    if (t != null) trendPcts.push({ t, rev: w.revenue || 0 });
    const r = DATA.reviews[loc];
    if (r && r.rating && r.count) { ratingNum += r.rating * r.count; ratingDen += r.count; }
    const subs = (DATA.quality && DATA.quality[loc]) || {};
    const qk = Object.keys(subs).sort();
    if (qk.length) qScores.push(subs[qk[qk.length-1]].score);
  });
  const trendRevSum = trendPcts.reduce((a,x)=>a+x.rev, 0);
  const groupCogs = rev ? inkoop / rev : null;
  const h = rollUpHealth(healthComponents({
    cogs_pct: groupCogs,
    cogs_incomplete: cogsLooksIncomplete(groupCogs, priorGroupCogs),
    labor_pct: rev ? labor / rev : null,
    productivity: hours ? rev / hours : null,
    rev_trend_pct: trendRevSum ? trendPcts.reduce((a,x)=>a + x.t * x.rev, 0) / trendRevSum : null,
    quality_score: qScores.length ? qScores.reduce((a,b)=>a+b,0) / qScores.length : null,
    quality_week: null,
    rating: ratingDen ? ratingNum / ratingDen : null,
  }));
  h.week = common;
  h.qCovered = qScores.length;
  return h;
}
// Donut gauge. `size` drives both the big group gauge and the small per-card
// rings, so there is only one piece of arc maths to get wrong.
function gaugeSvg(score, size, stroke) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const pct = score == null ? 0 : Math.max(0, Math.min(100, score)) / 100;
  const v = verdictOf(score);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--border-soft)" stroke-width="${stroke}"></circle>
    ${score == null ? '' : `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${v.color}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${(c*pct).toFixed(2)} ${c.toFixed(2)}"></circle>`}
  </svg>`;
}
// The thermometer follows whatever is currently selected: the Overview tab has
// no location chips (it IS the all-locations view), so it scores the group;
// every other tab is scoped to one location, so it scores that location. It is
// rendered on every tab rather than only on Overview -- otherwise switching
// tabs left a stale group score sitting above per-location content.
function renderThermometer() {
  const isGroup = state.section === 'overview';
  const h = isGroup ? healthForGroup() : healthForLocation(state.loc);
  const v = verdictOf(h.score);
  const gapsHtml = h.gaps.length ? h.gaps.map(g => {
    const clean = g.lost < 0.5;
    return `<div class="gap-row">
      <span class="gap-pts${clean?' ok':''}">${clean ? '✓' : '−' + g.lost.toFixed(1) + ' pt'}</span>
      <span class="gap-body"><span class="gap-what">${g.what}</span> <span class="gap-fix">${g.fix}</span></span>
    </div>`;
  }).join('') : `<div class="empty-state">Not enough complete weekly data yet to score ${isGroup ? 'the group' : state.loc}.</div>`;
  const missingHtml = (h.missing && h.missing.length)
    ? `<div class="footnote" style="margin-top:10px;"><b>Not scored this week:</b> ${h.missing.map(m =>
        m.reason ? `${m.label.toLowerCase()} — ${m.reason}` : `${m.label.toLowerCase()} (no data submitted yet)`
      ).join(' · ')} The remaining components were re-weighted to still total 100, so this score describes only what could actually be measured.</div>`
    : '';

  document.getElementById('sectionThermometer').innerHTML = `
    <div class="panel">
      <div class="section-title">Business thermometer — ${isGroup ? 'all four locations together' : state.loc}</div>
      <div class="thermo-wrap">
        <div>
          <div class="thermo-gauge">
            ${gaugeSvg(h.score, 190, 16)}
            <div class="thermo-center">
              <div class="thermo-score" style="color:${v.color}">${h.score == null ? '—' : Math.round(h.score)}</div>
              <div class="thermo-outof">out of 100</div>
              <div class="thermo-verdict" style="color:${v.color};background:${v.bg}">${v.label}</div>
            </div>
          </div>
        </div>
        <div>
          <div class="thermo-head">What is standing between you and 100${h.week ? ' — week ' + h.week : ''}</div>
          <div class="thermo-lead">Every component scores 100 when it <b>meets its target</b>, so 100 means "everything at target", not an unreachable ideal. The points below add up to exactly the gap to 100.</div>
          ${gapsHtml}
          ${missingHtml}
          <div class="footnote" style="margin-top:10px;">Weights: purchasing 20, labor 20, productivity 20, revenue momentum 15, quality check 15, Google rating 10.${isGroup ? ' Group cost ratios are computed from summed euros across locations, not from averaging the four location percentages, so a large location\'s overrun isn\'t diluted by smaller ones.' : ' Switch to the Overview tab for the combined score across all four locations.'} Purchasing currently only counts the suppliers linked in the Excel (butcher, Bidfood, greengrocer), so the real purchasing ratio is higher than shown — this widens once the Snelstart export is loaded.</div>
        </div>
      </div>
    </div>
  `;
}

function renderOverview() {
  const el = document.getElementById('sectionOverview');
  const foodMax = DATA.fixed_targets.food_cost_max;
  const laborMax = DATA.fixed_targets.labor_cost_max;

  const cards = LOCATIONS.map(loc => {
    const allWeeks = locWeeks(loc);
    // Anchor the whole card on the latest week that has revenue AND cost data
    // together (same "don't show a half-filled week" discipline as the Cost
    // side section's latestWithField(allWeeks,'labor_pct')) -- otherwise the
    // very newest week (revenue in, but labor/purchasing not entered yet)
    // would render a card that's mostly "—", which is honest but useless.
    let latest = allWeeks[allWeeks.length - 1] || {};
    for (let i = allWeeks.length - 1; i >= 0; i--) {
      if (allWeeks[i].revenue != null && allWeeks[i].labor_pct != null && allWeeks[i].cogs_pct != null) { latest = allWeeks[i]; break; }
    }
    const idx = allWeeks.indexOf(latest);
    const prev = idx > 0 ? allWeeks[idx - 1] : null;
    const wkLabel = latest.year ? (latest.year + '-W' + String(latest.week).padStart(2,'0')) : '—';

    const cogsRatio = latest.cogs_pct != null ? latest.cogs_pct * 100 : null;
    const laborRatio = latest.labor_pct != null ? latest.labor_pct * 100 : null;
    // Same thermometer maths as the group gauge, scoped to this location, so
    // the card ring and the big gauge can never tell contradicting stories.
    const lh = healthForLocation(loc);
    const lv = verdictOf(lh.score);

    return `
    <div class="loc-card${loc===state.loc?' active':''}" data-loc="${loc}">
      <div class="loc-card-head">
        <span class="loc-badge">${LOC_BADGES[loc]}</span>
        <span class="loc-card-name">${loc}</span>
        <span class="loc-card-wk">${wkLabel}</span>
        <span class="card-ring" title="Business thermometer: ${lh.score==null?'no data':Math.round(lh.score)+' / 100 (' + lv.label + ')'}">
          ${gaugeSvg(lh.score, 36, 4)}
          <span style="color:${lv.color}">${lh.score==null?'—':Math.round(lh.score)}</span>
        </span>
      </div>
      <div class="loc-headline-lbl">Revenue</div>
      <div class="loc-headline-val">${fmtEur(latest.revenue)} ${prev ? deltaBadge(latest.revenue, prev.revenue) : ''}</div>
      ${metricRow('Purchasing', fmtEur(latest.inkoop_total), prev ? deltaBadge(latest.cogs_pct, prev.cogs_pct, {mode:'pp', invert:true}) : '', latest.cogs_pct!=null?fmtPct(latest.cogs_pct):null, cogsRatio, (cogsRatio!=null && cogsRatio/100>foodMax) ? 'c-red' : 'c-green')}
      ${metricRow('Gross profit', fmtEur(latest.gross_profit), prev ? deltaBadge(latest.gross_profit, prev.gross_profit) : '', (latest.revenue && latest.gross_profit!=null)?fmtPct(latest.gross_profit/latest.revenue):null, null, null)}
      ${metricRow('Labor cost', fmtEur(latest.labor_cost), prev ? deltaBadge(latest.labor_pct, prev.labor_pct, {mode:'pp', invert:true}) : '', latest.labor_pct!=null?fmtPct(latest.labor_pct):null, laborRatio, (laborRatio!=null && laborRatio/100>laborMax) ? 'c-red' : 'c-green')}
      <div class="metric-sub">${latest.hours!=null ? fmtNum(latest.hours,0)+'u worked' : 'Hours not yet recorded'}</div>
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="panel">
      <div class="section-title">Overview — all locations</div>
      <div class="loc-card-grid">${cards}</div>
      <div class="footnote">Figures are per most recently completed week, not a live daily feed (the source data updates weekly). Deltas are vs. the previous week for that location; percentage-point (pp) deltas on Purchasing/Labor cost show the change in the cost ratio itself, not the euro amount. Click a card to open that location's full breakdown.</div>
    </div>
  `;

  el.querySelectorAll('.loc-card').forEach(card => {
    card.onclick = () => { state.loc = card.dataset.loc; state.section = 'productiviteit'; renderAll(); };
  });
}

// ---------------- PRODUCTIVITY ----------------
function renderProductiviteit() {
  const el = document.getElementById('sectionProductiviteit');
  const weeks = weeksInPeriod(state.loc);
  const allWeeks = locWeeks(state.loc);
  const latest = latestWithField(allWeeks, 'productivity');
  const latestIdx = allWeeks.indexOf(latest);
  const prevYr = latestIdx > 0 ? allWeeks[latestIdx - 1] : null;
  const target = DATA.fixed_targets.productivity_min;
  const prodDelta = (latest.productivity != null && prevYr && prevYr.productivity != null) ? latest.productivity - prevYr.productivity : null;
  const itemsLatest = latestWithField(allWeeks, 'items_per_hour');
  const ordersLatest = latestWithField(allWeeks, 'orders_per_hour');
  // Barista-uitsplitsing: alleen Weteringschans heeft een aparte barista-regel
  // in de Excel (rij 19, sub-regel van Front of House). Voor de andere drie
  // locaties blijft dit leeg en wordt de kaart niet getoond -- liever geen
  // kaart dan een kaart met een streepje.
  // state.baristaBasis bepaalt de noemer: alle dranken, alleen warm, of alles
  // wat de bar maakt (warm + iced). Alleen "drink" heeft historie tot 2025 --
  // de andere twee komen uit de itemverkopen en beginnen pas bij 2026-W20.
  const BB = {
    drink:   { field:'barista_prod_drink',   rev:'drink',         label:'all drinks' },
    warm:    { field:'barista_prod_warm',    rev:'warm_drink',    label:'hot drinks only' },
    barista: { field:'barista_prod_barista', rev:'barista_drink', label:'bar-made drinks (hot + iced)' },
  };
  // De warm/bar-made-noemers komen uit de itemverkopen en die zijn voor de
  // meeste weken onbetrouwbaar (zie de dekkingscontrole in de bouwstap).
  // Zolang er voor deze locatie geen enkele week doorheen komt, tonen we de
  // schakelaar niet en staat alles op de drankomzet uit Report_API.xlsx --
  // die klopt wel. Zodra de itemhistorie opnieuw is opgehaald, verschijnt de
  // schakelaar vanzelf; hier hoeft dan niets aan te veranderen.
  const altBasisAvailable = allWeeks.some(w => w.warm_drink != null || w.barista_drink != null);
  if (!altBasisAvailable) state.baristaBasis = 'drink';
  const bb = BB[state.baristaBasis] || BB.drink;
  const baristaLatest = latestWithField(allWeeks, bb.field);
  const hasBarista = baristaLatest && baristaLatest[bb.field] != null;
  const bpIdx = hasBarista ? allWeeks.indexOf(baristaLatest) : -1;
  const bpPrev = bpIdx > 0 ? allWeeks[bpIdx - 1] : null;
  const bpDelta = (hasBarista && bpPrev && bpPrev[bb.field] != null)
    ? baristaLatest[bb.field] - bpPrev[bb.field] : null;
  const anyBarista = allWeeks.some(w => w.hours_barista != null);

  el.innerHTML = `
    <div class="panel">
      <div class="section-title">Productivity — ${state.loc}</div>
      <div class="chip-row" id="periodChipsProd" style="margin-bottom:12px;"></div>
      <div class="kpi-grid">
        <div class="kpi">
          <div class="lbl">Revenue per labor hour (${latest.year||''}-W${latest.week?String(latest.week).padStart(2,'0'):'—'})</div>
          <div class="val">${latest.productivity != null ? fmtEur1(latest.productivity) : '—'}</div>
          <div class="ref ${latest.productivity!=null && latest.productivity < target ? 'bad':'good'}">Target: ≥ ${fmtEur(target)}/hour ${prodDelta!=null ? (prodDelta>=0?'▲ +'+fmtEur1(prodDelta)+' vs previous week':'▼ '+fmtEur1(prodDelta)+' vs previous week') : ''}</div>
        </div>
        <div class="kpi">
          <div class="lbl">Labor hours${latest.hours_bakery ? ' (shop)' : ''}</div>
          <div class="val">${fmtNum(latest.hours_bakery ? latest.hours_foh : latest.hours,0)}</div>
          <div class="ref">${latest.hours_bakery ? '+ '+fmtNum(latest.hours_bakery,0)+'u bakery'+(latest.hours_events?' + '+fmtNum(latest.hours_events,0)+'u events':'')+' = '+fmtNum(latest.hours,0)+'u total &middot; ' : ''}${latest.hours_barista != null ? 'Shop split: '+fmtNum(latest.hours_barista,0)+'u barista + '+fmtNum(latest.hours_foh_other,0)+'u overig &middot; ' : ''}Labor cost: ${fmtEur(latest.labor_cost)}</div>
        </div>
        ${anyBarista ? `
        <div class="kpi">
          <div class="lbl">Revenue per barista hour${altBasisAvailable ? ' &mdash; '+bb.label : ''}${hasBarista ? ' ('+baristaLatest.year+'-W'+String(baristaLatest.week).padStart(2,'0')+')' : ''}</div>
          <div class="val">${hasBarista ? fmtEur1(baristaLatest[bb.field]) : '—'}</div>
          <div class="ref">${hasBarista
            ? fmtEur(baristaLatest[bb.rev])+' &divide; '+fmtNum(baristaLatest.hours_barista,1)+'u barista'+(bpDelta!=null ? ' &middot; '+(bpDelta>=0?'▲ +'+fmtEur1(bpDelta):'▼ '+fmtEur1(bpDelta))+' vs previous week' : '')
            : 'No item-level drink data for this basis yet'}</div>
          ${altBasisAvailable ? `<div class="chip-row" style="margin-top:8px;">
            ${Object.keys(BB).map(k=>`<button class="chip${state.baristaBasis===k?' active':''}" data-bbasis="${k}">${BB[k].label}</button>`).join('')}
          </div>` : ''}
        </div>` : ''}
        <div class="kpi">
          <div class="lbl">Items sold per hour</div>
          <div class="val">${itemsLatest.items_per_hour != null ? fmtNum(itemsLatest.items_per_hour,1) : '—'}</div>
          <div class="ref">${itemsLatest.items_sold != null ? fmtNum(itemsLatest.items_sold,0)+' items in '+itemsLatest.year+'-W'+String(itemsLatest.week).padStart(2,'0') : 'No item data yet'}</div>
        </div>
        <div class="kpi">
          <div class="lbl">Orders per opening hour</div>
          <div class="val">${ordersLatest.orders_per_hour != null ? fmtNum(ordersLatest.orders_per_hour,1) : '—'}</div>
          <div class="ref">${ordersLatest.orders != null && ordersLatest.open_hours != null ? fmtNum(ordersLatest.orders,0)+' orders over ~'+fmtNum(ordersLatest.open_hours,1)+' open hours ('+ordersLatest.year+'-W'+String(ordersLatest.week).padStart(2,'0')+')' : 'Opening-hours/AOV coverage still limited'}</div>
        </div>
      </div>
      ${fcPanelHtml(state.loc)}
      ${fpPanelHtml(state.loc)}
      <div class="two-col">
        <div>
          <h2 style="margin-bottom:6px;">Revenue per hour — trend</h2>
          <div class="chart-wrap"><canvas id="chartProdTrend"></canvas></div>
        </div>
        <div>
          <h2 style="margin-bottom:6px;">Items/labor-hour &amp; orders/opening-hour — trend</h2>
          <div class="chart-wrap"><canvas id="chartProdCross"></canvas></div>
        </div>
      </div>
      <div class="footnote">"Productivity" = revenue ÷ labor hours, the same definition as the "Productiviteit" row in Report_API.xlsx. "Items sold per hour" is items ÷ labor hours — a staffing-productivity measure, joining item-sales data onto the same labor hours as above. "Orders per opening hour" is a different kind of measure — orders ÷ actual hours the shop was open that week, so the two lines on the chart to the right aren't on the same basis and shouldn't be compared directly. Opening hours aren't available from Lightspeed directly; they're estimated from the span between the first and last recorded transaction each day, so they slightly understate true opening hours and a week with only 1-2 trading days of usable data is excluded rather than shown as partial. Day/daypart-level detail isn't available — the source data is aggregated weekly, not daily. "Revenue per barista hour" (Weteringschans only for now) sets drink revenue against just the barista hours from L1NDA, instead of the whole Front-of-House roster — the shop-wide productivity figure spreads coffee revenue over bagel makers too, which flatters or punishes the bar depending on how the week was staffed. It uses the drinks line from Report_API.xlsx, which includes bottled water, sodas and juices alongside anything the bar makes — so it tracks the bar's output rather than measuring it exactly. Splitting it into hot-only and bar-made (hot + iced coffee, matcha and chai) needs item-level sales, and item_sales_history.json currently covers only a fraction of real revenue for most weeks, so that split is switched off rather than shown on unreliable numbers; it appears automatically once the item history has been re-pulled. Barista hours come from the "Waarvan barista" line in Report_API.xlsx (row 19), a sub-line of Front of House — it is not added on top of the shop total.</div>
    </div>
    <div class="panel">
      <div class="section-title">Productivity — comparison across locations</div>
      <div class="chart-wrap small"><canvas id="chartProdCompare"></canvas></div>
      <div class="footnote">Average revenue per labor hour over the selected period, per location.</div>
    </div>
  `;
  buildPeriodChips('periodChipsProd');
  el.querySelectorAll('[data-bbasis]').forEach(b => {
    b.addEventListener('click', () => { state.baristaBasis = b.dataset.bbasis; renderAll(); });
  });

  const labels = weeks.map(w => w.year + '-W' + String(w.week).padStart(2,'0'));
  makeLineChart('chartProdTrend', labels, [
    { label:'Revenue/hour', data: weeks.map(w=>w.productivity), borderColor:'#7a3f22', backgroundColor:'#7a3f2222', tension:.25, spanGaps:true },
    { label:'Target', data: weeks.map(()=>target), borderColor:'#b5652f', borderDash:[6,4], pointRadius:0, tension:0 },
    // Barista-lijn alleen tekenen waar er barista-uren zijn; voor de andere
    // drie locaties bestaat de reeks niet en zou een lege legenda-regel
    // suggereren dat er data mist die er nooit was.
    ...(anyBarista ? [{ label:'Barista €/hour ('+bb.label+')', data: weeks.map(w=>w[bb.field]), borderColor:'#4a7c4e', backgroundColor:'#4a7c4e22', tension:.25, spanGaps:true }] : []),
  ], v => '€'+v);

  makeLineChart('chartProdCross', labels, [
    { label:'Items/labor-hour', data: weeks.map(w=>w.items_per_hour), borderColor:'#4a7c4e', backgroundColor:'#4a7c4e22', tension:.25, spanGaps:true, yAxisID:'y' },
    { label:'Orders/opening-hour', data: weeks.map(w=>w.orders_per_hour), borderColor:'#d9a441', backgroundColor:'#d9a44122', tension:.25, spanGaps:true, yAxisID:'y' },
  ]);

  const compareLabels = LOCATIONS;
  const compareVals = LOCATIONS.map(loc => {
    const ws = weeksInPeriod(loc).filter(w => w.productivity != null);
    if (!ws.length) return null;
    return ws.reduce((a,w)=>a+w.productivity,0) / ws.length;
  });
  makeBarChart('chartProdCompare', compareLabels, [
    { label:'Avg. revenue/hour', data: compareVals, backgroundColor: LOCATIONS.map(l => l===state.loc ? '#7a3f22' : '#d8c6ac') },
  ], v => '€'+v);
}

// ---------------- SERVICE ----------------
function renderService() {
  const el = document.getElementById('sectionService');
  const r = DATA.reviews[state.loc];
  const delta = r ? (r.recent_avg - r.rating) : null;
  const deltaHtml = delta == null ? '' : (delta >= 0
    ? `<span class="delta-up">▲ +${delta.toFixed(1)}</span>`
    : `<span class="delta-down">▼ ${delta.toFixed(1)}</span>`);

  const bars = (r && r.breakdown) ? r.breakdown.map((n, i) => {
    const stars = 5 - i;
    const max = Math.max(...r.breakdown);
    const pct = max ? Math.round((n / max) * 100) : 0;
    return `<div class="review-bar-row"><span>${stars}★</span><div class="review-bar-track"><div class="review-bar-fill" style="width:${pct}%"></div></div><span>${n}</span></div>`;
  }).join('') : '<div class="review-bar-row" style="font-style:italic;">Star breakdown not available.</div>';

  const keywords = r ? r.keywords.map(k => `<span class="review-keyword">${k}</span>`).join('') : '';

  const compRows = DATA.competitors.map(c => `
    <div class="competitor-card">
      <h4>${c.name} <span class="review-count">${c.area}</span></h4>
      <span class="review-stars">${starString(c.rating)}</span> <b>${c.rating.toFixed(1)}</b>
      <span class="review-count">${c.count ? '('+c.count.toLocaleString('en-GB')+' reviews)' : ''}</span>
      <div class="review-analysis">${c.summary}</div>
      <div class="footnote"><b>Operational:</b> ${c.takeaway}</div>
      <div class="footnote">Source: ${c.source}</div>
    </div>
  `).join('');

  const allRatings = LOCATIONS.map(l => DATA.reviews[l].rating);
  const compRatings = DATA.competitors.map(c => c.rating);
  const compareLabels = [...LOCATIONS, ...DATA.competitors.map(c=>c.name)];
  const compareVals = [...allRatings, ...compRatings];
  const compareColors = [...LOCATIONS.map(l => l===state.loc ? '#7a3f22' : '#d8c6ac'), ...DATA.competitors.map(()=>'#4a7c4e')];

  el.innerHTML = `
    <div class="panel">
      <div class="section-title">Service — ${state.loc} (Google reviews)</div>
      <div class="kpi-grid">
        <div class="kpi">
          <div class="lbl">Rating (all-time)</div>
          <div class="val"><span class="review-stars">${starString(r.rating)}</span> ${r.rating.toFixed(1)}</div>
          <div class="ref">${r.count} reviews total</div>
        </div>
        <div class="kpi">
          <div class="lbl">Recent cluster</div>
          <div class="val">${r.recent_avg.toFixed(1)} ${deltaHtml}</div>
          <div class="ref">${r.recent_window}</div>
        </div>
      </div>
      <div class="two-col">
        <div>
          <h2 style="margin-bottom:6px;">Star breakdown (all-time)</h2>
          <div class="review-bars">${bars}</div>
          <div class="review-keywords">${keywords}</div>
        </div>
        <div>
          <h2 style="margin-bottom:6px;">What reviewers say</h2>
          <div class="review-analysis">${r.analysis}</div>
        </div>
      </div>
      <div class="footnote">${DATA.reviews_note} Snapshot: ${DATA.reviews_captured}.</div>
    </div>
    <div class="panel">
      <div class="section-title">Rating comparison: BagelBoy vs. higher-scoring Amsterdam concepts</div>
      <div class="chart-wrap small"><canvas id="chartServiceCompare"></canvas></div>
      <div class="review-grid" style="margin-top:14px;">${compRows}</div>
      <div class="footnote">${DATA.competitors_note}</div>
    </div>
  `;
  makeBarChart('chartServiceCompare', compareLabels, [
    { label:'Google rating', data: compareVals, backgroundColor: compareColors },
  ], v => v.toFixed(1));
}

      <div class="kpi-grid">

          <div class="val">${fmtPct(latest.cogs_pct)}</div>

    <div class="panel">

}

// ---------------- QUALITY ----------------
function renderKwaliteit() {
  const el = document.getElementById('sectionKwaliteit');
  const submissions = (DATA.quality[state.loc]) || {};
  const weeks = Object.keys(submissions).sort();
  const latestWk = weeks[weeks.length - 1];
  const latest = latestWk ? submissions[latestWk] : null;

  const pillarRows = DATA.quality_config.pillars.map(p => {
    const val = latest ? (latest.pillarScores && latest.pillarScores[p.key]) || 0 : 0;
    const pct = Math.round((val / p.maxPoints) * 100);
    return `<div class="pillar-bar-row"><span style="width:220px;">${p.label}</span><div class="pillar-bar-track"><div class="pillar-bar-fill" style="width:${pct}%"></div></div><span>${val} / ${p.maxPoints}</span></div>`;
  }).join('');

  let trendHtml = '<div class="empty-state">No history yet — a trend line will appear here after a few weeks of submissions.</div>';
  let scoreBlock;
  if (latest) {
    scoreBlock = `
      <div class="kpi">
        <div class="lbl">Score for last submitted week (${latestWk})</div>
        <div class="val">${latest.score.toFixed(1)} / 100</div>
        <div class="ref">Submitted by ${latest.submittedBy || '—'}</div>
      </div>`;
  } else {
    scoreBlock = `
      <div class="kpi">
        <div class="lbl">Score</div>
        <div class="val">—</div>
        <div class="ref">No quality check submitted yet for ${state.loc}</div>
      </div>`;
  }

  el.innerHTML = `
    <div class="panel">
      <div class="section-title">Quality — ${state.loc}</div>
      <div class="kpi-grid">${scoreBlock}</div>
      ${latest ? `<h2 style="margin:14px 0 8px;">Score per pillar</h2>${pillarRows}` : '<div class="empty-state">Fill in the weekly quality check via quality_intake.html (same folder) to populate this section.</div>'}
      <div class="two-col" style="margin-top:14px;">
        <div>
          <h2 style="margin-bottom:6px;">Score trend</h2>
          <div class="chart-wrap small"><canvas id="chartQualityTrend"></canvas></div>
        </div>
        <div>
          <h2 style="margin-bottom:6px;">Latest notes</h2>
          <div class="review-analysis">${latest && latest.notes && (latest.notes.bottleneck || latest.notes.other) ?
            `<b>Bottleneck:</b> ${latest.notes.bottleneck || '—'}<br><b>Other:</b> ${latest.notes.other || '—'}` :
            '<i>No notes available yet.</i>'}</div>
        </div>
      </div>
      <div class="footnote">${DATA.quality_method_note}</div>
    </div>
    <div class="panel">
      <div class="section-title">Methodology</div>
      <table>
        <tr><th>Pillar</th><th>Max. points</th></tr>
        ${DATA.quality_config.pillars.map(p => `<tr><td>${p.label}</td><td>${p.maxPoints}</td></tr>`).join('')}
      </table>
      <div class="footnote">Questionnaire version ${DATA.quality_config.version}. The full questionnaire and submission form live in <code>quality_intake.html</code> in the same folder.</div>
    </div>
  `;

  if (weeks.length > 1) {
    document.querySelector('#sectionKwaliteit .chart-wrap.small').outerHTML = '<div class="chart-wrap small"><canvas id="chartQualityTrend"></canvas></div>';
    makeLineChart('chartQualityTrend', weeks, [
      { label:'Score', data: weeks.map(w=>submissions[w].score), borderColor:'#7a3f22', backgroundColor:'#7a3f2222', tension:.25 },
    ], v=>v);
  } else {
    const ctx = document.getElementById('chartQualityTrend');
    if (ctx) ctx.parentElement.innerHTML = trendHtml;
  }
}



// ---------------------------------------------------------------------------
// Collapsible forecast panel. Closed by default: it is a supporting view, not
// the headline, and an open panel would push the actual week's numbers down.
// ---------------------------------------------------------------------------
const fcState = {};   // loc -> {open, growth, taper}
function fcS(loc) { return (fcState[loc] = fcState[loc] || { open: false, mode: 'data', adj: 0, growth: null, taper: null }); }

function fcPanelHtml(loc) {
  const st = fcS(loc);
  const tune = fcTune(loc);                       // settings proven best on this location's own history
  const measured = fcDefaultGrowth(loc, tune.win);
  const basis = fcGrowthBasis(loc, tune.win);
  // Two ways to read the future, and the choice is explicit rather than hidden
  // in whether a slider happens to have been touched:
  //   data   -- the measured 13-week run-rate, nudged up or down in points
  //   manual -- your own number, starting from the measured one
  const mode = st.mode || 'data';
  const adj = st.adj != null ? st.adj : 0;
  const chain = fcChainLastYear(loc, st.anchor || 1);
  const g = mode === 'manual' ? (st.growth != null ? st.growth : measured) : measured + adj;
  // The plain view deliberately does not fade: it is last year plus one
  // percentage, and adding a decay would make it something else.
  const t = mode === 'basic' ? 0 : (st.taper != null ? st.taper : tune.taper);
  const fc = mode === 'basic' && chain
    ? chain.steps.map(s => ({ year: s.year, week: s.week, value: s.value, basis: s.known ? 'last year' : 'flat' }))
    : fcForecast(loc, g, t);
  if (!fc.length) return '';
  const total = fc.reduce((a, f) => a + f.value, 0);
  const hist = fcActuals(loc).slice(-FC_HORIZON);
  const ly = fcHorizonLastYear(loc);
  const delta = ly.total ? (total / ly.total - 1) * 100 : null;
  // What the pure data answer would be, always shown so a scenario can be
  // judged against it instead of replacing it.
  const dataTotal = fcForecast(loc, measured, tune.taper).reduce((a, f) => a + f.value, 0);
  const rows = fc.slice(0, 6).map(f =>
    `<tr><td>${f.year}-W${String(f.week).padStart(2, '0')}</td>`
    + `<td style="text-align:right">${fmtEur(f.value)}</td>`
    + `<td style="text-align:right;color:var(--muted);font-size:12px">${mode === 'basic' && chain
        ? (chain.steps[fc.indexOf(f)] ? (chain.steps[fc.indexOf(f)].known
            ? (chain.steps[fc.indexOf(f)].stepPct >= 0 ? '+' : '') + chain.steps[fc.indexOf(f)].stepPct.toFixed(1) + '% wk/wk'
            : 'flat') : '')
        : (f.basis === 'last year' ? 'vs last year' : 'seasonal')}</td></tr>`).join('');
  return `
  <div class="fc-wrap" data-loc="${loc}">
    <div class="fc-head">
      <button class="fc-toggle" data-loc="${loc}">${st.open ? '▾' : '▸'} Revenue forecast — next ${FC_HORIZON} weeks</button>
      <span class="fc-sum">${fmtEur(total)}${delta != null ? ` <span class="${delta >= 0 ? 'good' : 'bad'}">${delta >= 0 ? '+' : ''}${delta.toFixed(1)}% vs the same ${ly.matched} weeks last year</span>` : ''}</span>
      <span class="fc-info" title="${fcExplain(loc, g, t).replace(/"/g, '&quot;')}">&#9432;</span>
    </div>
    <div class="fc-body" style="display:${st.open ? 'block' : 'none'}">
      <div class="fc-modes">
        <span class="fc-mode${mode === 'basic' ? ' on' : ''}" data-loc="${loc}" data-mode="basic">Last year's weekly steps, from now</span>
        <span class="fc-mode${mode === 'data' ? ' on' : ''}" data-loc="${loc}" data-mode="data">From the data — ${FC_HORIZON}-week run-rate</span>
        <span class="fc-mode${mode === 'manual' ? ' on' : ''}" data-loc="${loc}" data-mode="manual">My own scenario</span>
      </div>
      <div class="fc-why">${mode === 'basic' ? fcChainSentence(loc, st.anchor || 1) : fcGrowthSentence(loc, g, t)}<br><span class="fc-track">${fcTuneSentence(loc)}</span></div>
      <div class="fc-controls">
        ${mode === 'basic'
          ? `<label>Start from
               <select data-fc="anchor" data-loc="${loc}">
                 <option value="1"${(st.anchor || 1) === 1 ? ' selected' : ''}>the last week</option>
                 <option value="4"${st.anchor === 4 ? ' selected' : ''}>the last 4 weeks (average)</option>
               </select>
               <span class="fc-ref">then follow last year's week-on-week moves — no growth added</span></label>`
          : mode === 'data'
          ? `<label>Measured growth <b>${measured > 0 ? '+' : ''}${measured}%</b>
               <span class="fc-ref">${basis.source === 'peers' ? 'borrowed from ' + basis.peers.join(', ') : 'own history'}</span></label>
             <label>Adjust
               <input type="range" min="-30" max="30" step="1" value="${adj}" data-fc="adj" data-loc="${loc}">
               <b>${adj > 0 ? '+' : ''}${adj} pp</b> → <b>${g > 0 ? '+' : ''}${g}%</b>
               ${adj !== 0 ? `<a href="#" class="fc-reset" data-loc="${loc}" data-fc="adj">reset</a>` : ''}</label>`
          : `<label>Growth vs last year <span class="fc-info" title="How much faster or slower than the same week last year. +50% means a week that did EUR 10.000 last year is forecast at EUR 15.000. Starts on the rate measured over the last 13 weeks.">&#9432;</span>
               <input type="range" min="-20" max="90" step="1" value="${g}" data-fc="growth" data-loc="${loc}">
               <b>${g > 0 ? '+' : ''}${g}%</b>
               <span class="fc-ref">data says ${measured > 0 ? '+' : ''}${measured}%${st.growth != null && st.growth !== measured ? ` <a href="#" class="fc-reset" data-loc="${loc}" data-fc="growth">reset</a>` : ''}</span></label>`}
        <label>Growth fades by <span class="fc-info" title="How much of that growth has disappeared by the last forecast week. At 55%, a +50% rate is down to +22% by week 13. 0% = the current pace holds the whole quarter; 100% = growth is gone by the end. Assuming today's pace holds forever is the classic way a forecast goes wrong, so it fades by default.">&#9432;</span>
          <input type="range" min="0" max="100" step="5" value="${t}" data-fc="taper" data-loc="${loc}">
          <b>${t}%</b>
          <span class="fc-ref">tuned ${tune.taper}%${st.taper != null && st.taper !== tune.taper ? ` <a href="#" class="fc-reset" data-loc="${loc}" data-fc="taper">reset</a>` : ''}</span></label>
      </div>
      ${Math.abs(total - dataTotal) > 1 ? `<div class="fc-cmp">Your scenario: <b>${fmtEur(total)}</b> &middot; straight from the data: ${fmtEur(dataTotal)} <span class="${total >= dataTotal ? 'good' : 'bad'}">(${total >= dataTotal ? '+' : ''}${fmtEur(total - dataTotal)})</span></div>` : ''}
      <div class="chart-box" style="height:240px"><canvas id="fcChart_${loc}"></canvas></div>
      <table class="fc-table"><tr><th>Week</th><th style="text-align:right">Forecast</th><th style="text-align:right">Basis</th></tr>${rows}</table>
      ${fcLogHtml()}
    </div>
  </div>`;
}

function fcDrawChart(loc) {
  const st = fcS(loc);
  if (!st.open) return;
  const tune = fcTune(loc);
  const measured = fcDefaultGrowth(loc, tune.win);
  const mode = st.mode || 'data';
  const bx = fcLastYearIndex(loc);
  const basicG = bx && bx.pct != null ? Math.round(bx.pct) : measured;
  const g = mode === 'manual' ? (st.growth != null ? st.growth : measured)
          : mode === 'basic' ? basicG : measured + (st.adj != null ? st.adj : 0);
  const t = mode === 'basic' ? 0 : (st.taper != null ? st.taper : tune.taper);
  const hist = fcActuals(loc).slice(-FC_HORIZON);
  const ch = mode === 'basic' ? fcChainLastYear(loc, st.anchor || 1) : null;
  const fc = ch ? ch.steps.map(s => ({ year: s.year, week: s.week, value: s.value })) : fcForecast(loc, g, t);
  const labels = hist.map(s => `${s.year}-W${String(s.week).padStart(2, '0')}`)
    .concat(fc.map(f => `${f.year}-W${String(f.week).padStart(2, '0')}`));
  // The two series overlap on the last actual week so the lines join up instead
  // of showing a gap the eye reads as a drop.
  const histVals = hist.map(s => s.revenue).concat(fc.map(() => null));
  const fcVals = hist.map((_, i) => i === hist.length - 1 ? hist[i].revenue : null).concat(fc.map(f => f.value));
  const el = document.getElementById('fcChart_' + loc);
  if (!el) return;
  makeLineChart('fcChart_' + loc, labels, [
    { label: 'Actual', data: histVals, borderColor: '#7a3f22', backgroundColor: 'rgba(122,63,34,.08)', fill: true, tension: .3, pointRadius: 2 },
    { label: 'Forecast', data: fcVals, borderColor: '#b5652f', borderDash: [6, 4], fill: false, tension: .3, pointRadius: 2 },
  ], v => '€' + Math.round(v / 1000) + 'k');
}

function fcBind(scope) {
  (scope || document).querySelectorAll('.fc-toggle').forEach(b => {
    b.addEventListener('click', () => { const l = b.dataset.loc; fcS(l).open = !fcS(l).open; renderAll(); });
  });
  (scope || document).querySelectorAll('.fc-mode').forEach(el => {
    el.addEventListener('click', () => { fcS(el.dataset.loc).mode = el.dataset.mode; renderAll(); });
  });
  (scope || document).querySelectorAll('.fc-reset').forEach(a => {
    a.addEventListener('click', ev => { ev.preventDefault(); fcS(a.dataset.loc)[a.dataset.fc] = null; renderAll(); });
  });
  (scope || document).querySelectorAll('select[data-fc]').forEach(sel => {
    sel.addEventListener('change', () => { fcS(sel.dataset.loc).anchor = Number(sel.value); renderAll(); });
  });
  (scope || document).querySelectorAll('input[data-fc]').forEach(inp => {
    inp.addEventListener('input', () => {
      const l = inp.dataset.loc;
      fcS(l)[inp.dataset.fc] = Number(inp.value);
      renderAll();
    });
  });
}

// ---------------------------------------------------------------------------
// Layer-2 panel. Collapsed and clearly marked: the simple forecast stays the
// default because it is explainable in one sentence, and this one is only worth
// opening when the decision justifies the extra machinery.
// ---------------------------------------------------------------------------
let fpOpen = {};
function fpPanelHtml(loc) {
  const open = !!fpOpen[loc];
  const ev = fpEvaluate();
  if (!ev.ok) return '<div class="fc-wrap"><div class="fc-head"><b>Advanced forecast</b> <span class="muted">— needs more history (' + (ev.n || 0) + ' scored weeks so far)</span></div></div>';
  const fc = fpForecast(loc);
  if (!fc.length) return '<div class="fc-wrap"><div class="fc-head"><b>Advanced forecast</b> <span class="muted">— ' + loc + ' has too little history for this model yet; the two views above still work.</span></div></div>';
  const tot = fc.reduce((a, f) => a + f.p50, 0);
  const lo = fc.reduce((a, f) => a + f.p10, 0), hi = fc.reduce((a, f) => a + f.p90, 0);
  const mine = ev.byLoc.find(x => x.loc === loc);
  const rows = fc.map(f =>
    `<tr><td>${f.year}-W${String(f.week).padStart(2, '0')}</td>`
    + `<td style="text-align:right">${fmtEur(f.p10)}</td>`
    + `<td style="text-align:right"><b>${fmtEur(f.p50)}</b></td>`
    + `<td style="text-align:right">${fmtEur(f.p90)}</td></tr>`).join('');
  return `
  <div class="fc-wrap fp-wrap" data-loc="${loc}">
    <div class="fc-head">
      <button class="fp-toggle" data-loc="${loc}">${open ? '▾' : '▸'} Advanced forecast <span class="fp-beta">beta</span></button>
      <span class="fc-sum">${fmtEur(tot)} <span class="muted">band ${fmtEur(lo)} – ${fmtEur(hi)}</span></span>
      <span class="fc-info" title="A pooled model across all four locations: ridge regression on calendar and trend features, blended with the seasonal-naive method the simple forecast uses. The blend weight is not chosen but measured — whatever scored best in walk-forward tests. Predicts a ratio to the recent level rather than an amount, so one model fits shops of very different size. Bands come from the actual spread of past errors at that horizon, not from a formula.">&#9432;</span>
    </div>
    <div class="fp-body" style="display:${open ? 'block' : 'none'}">
      <div class="fc-why">
        Tested on ${ev.origins} historical starting points, ${ev.n} forecast weeks.
        Seasonal-naive (what the simple forecast does): <b>${ev.naiveWape.toFixed(1)}%</b> ·
        ridge alone: <b>${ev.ridgeWape.toFixed(1)}%</b> ·
        blend of ${(ev.weight * 100).toFixed(0)}% ridge: <b>${ev.wape.toFixed(1)}%</b> WAPE.
        ${mine ? `For ${loc} specifically: ${mine.wape.toFixed(1)}% versus ${mine.naive.toFixed(1)}% naive — ${mine.wape < mine.naive ? 'this model wins here' : 'the simple one still wins here, so treat this as a second opinion'}.` : ''}
        <br><span class="fc-track">These percentages are per-week error, so they are not comparable with the 13-week total error shown in the simple panel above — a bigger number here is not a worse model.</span>
      </div>
      <div class="chart-box" style="height:240px"><canvas id="fpChart_${loc}"></canvas></div>
      <table class="fc-table"><tr><th>Week</th><th style="text-align:right">Low (p10)</th><th style="text-align:right">Expected</th><th style="text-align:right">High (p90)</th></tr>${rows}</table>
      <div class="muted" style="margin-top:8px">Not in this model: weather, one-off events, price changes. The learning loop that logs each forecast and scores it later needs the Apps Script redeploy.</div>
    </div>
  </div>`;
}
function fpDraw(loc) {
  if (!fpOpen[loc]) return;
  const fc = fpForecast(loc);
  const hist = fcActuals(loc).slice(-13);
  const labels = hist.map(s => `${s.year}-W${String(s.week).padStart(2, '0')}`)
    .concat(fc.map(f => `${f.year}-W${String(f.week).padStart(2, '0')}`));
  const pad = fc.map(() => null);
  const histVals = hist.map(s => s.revenue).concat(pad);
  const mid = hist.map((_, i) => i === hist.length - 1 ? hist[i].revenue : null).concat(fc.map(f => f.p50));
  const lo = hist.map(() => null).concat(fc.map(f => f.p10));
  const hi = hist.map(() => null).concat(fc.map(f => f.p90));
  if (!document.getElementById('fpChart_' + loc)) return;
  makeLineChart('fpChart_' + loc, labels, [
    { label: 'p90', data: hi, borderColor: 'rgba(232,114,42,.25)', backgroundColor: 'rgba(232,114,42,.15)', fill: '+2', pointRadius: 0, tension: .3 },
    { label: 'Actual', data: histVals, borderColor: '#1F2937', fill: false, tension: .3, pointRadius: 2 },
    { label: 'p10', data: lo, borderColor: 'rgba(232,114,42,.25)', fill: false, pointRadius: 0, tension: .3 },
    { label: 'Forecast', data: mid, borderColor: '#E8722A', borderWidth: 2, borderDash: [6, 4], fill: false, tension: .3, pointRadius: 2 },
  ], v => '€' + Math.round(v / 1000) + 'k');
}
function fpBind() {
  document.querySelectorAll('.fp-toggle').forEach(b => {
    b.addEventListener('click', () => { const l = b.dataset.loc; fpOpen[l] = !fpOpen[l]; renderAll(); });
  });
}

function renderAll() {
  buildLocationChips();
  buildSectionTabs();
  showOnly(state.section);
  renderThermometer();
  if (state.section === 'overview') renderOverview();
  if (state.section === 'productiviteit') { renderProductiviteit(); fcBind(); fcLogBind(); fcDrawChart(state.loc); fpBind(); fpDraw(state.loc); }
  if (state.section === 'service') renderService();
  if (state.section === 'kosten') renderKosten();
  if (state.section === 'kwaliteit') renderKwaliteit();
}

// The log lives on Drive, so it arrives after the page does. Draw once without
// it, then redraw when it lands -- a dashboard that waits on the network to
// show anything is a dashboard that looks broken on a bad connection.
function fcLogRender() { renderAll(); }
fcLogFetch().then(() => renderAll());

document.getElementById('generatedNote').textContent = DATA.generated;
document.getElementById('builtAtNote').textContent = 'File built ' + DATA.built_at;
renderAll();

</script>
</body>
</html>
